<style>
/* Layout: lantai gudang — header biru tinta, menu kiri (desktop) / tab atas (HP), satu aksi kuning "Scan" */
:root{

  --tape:#F5C33B; --tape-ink:#2B2100; --ok:#1F7A4D; --ok-bg:#E3F3EA; --bad:#B83227; --bad-bg:#FBE7E4;
  --warn:#9A6400; --warn-bg:#FDF1D8; --info:#1E5C96; --info-bg:#E2EEF9; --head:#16324F; --head-ink:#FFFFFF;
  --f:"Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1822; --surface:#15222F; --ink:#E4ECF3; --ink-2:#9FB2C3; --line:#2A3B4C;
  --tape:#F5C33B; --tape-ink:#2B2100; --ok:#5CC48E; --ok-bg:#12301F; --bad:#F07F72; --bad-bg:#3A1714;
  --warn:#F0B85A; --warn-bg:#33260C; --info:#7DB6EA; --info-bg:#142B42; --head:#0A2238; --head-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{

body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:1.35rem;font-weight:750;font-stretch:85%}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);border-bottom:4px solid var(--tape)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brandmark{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;border-radius:7px;background:var(--tape);color:var(--tape-ink);display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.brandmark b{font-weight:800;font-stretch:80%;font-size:1.1rem;letter-spacing:.01em;display:block;line-height:1.1}
.brandmark small{opacity:.75;font-size:.75rem}
.top label{font-size:.72rem;opacity:.8;display:block}
.top select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:5px 8px;min-width:0}
.top select option{color:#111;background:#fff}
.demo-pill{background:var(--tape);color:var(--tape-ink);font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px}

/* Shell */
.shell{display:grid;grid-template-columns:1fr;gap:0;max-width:1240px;margin:0 auto}
nav.menu{display:flex;gap:6px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface)}
nav.menu button{flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--ink-2);white-space:nowrap}
nav.menu button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
nav.menu .grp{display:none}
main{padding-block:18px 120px;min-width:0;display:grid;gap:18px;align-content:start}
@media (min-width:900px){
  .shell{grid-template-columns:230px minmax(0,1fr)}
  nav.menu{flex-direction:column;overflow:visible;border-bottom:0;border-right:1px solid var(--line);min-height:calc(100vh - 70px);padding:18px 12px;position:sticky;top:70px;align-self:start;background:transparent}
  nav.menu button{text-align:left;border:0;padding:8px 12px}
  nav.menu .grp{display:block;font-size:.72rem;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;padding:12px 12px 2px}
  main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}

/* Elements */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:650;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.tape{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);font-weight:800}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline;padding-inline:4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.78rem;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.badge{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-warn{background:var(--warn-bg);color:var(--warn)}.b-info{background:var(--info-bg);color:var(--info)}
.b-neu{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-weight:650;color:var(--ink-2);background:var(--paper);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.qty{font-weight:800;font-size:1.05rem}
.code{font-weight:700;font-stretch:80%;letter-spacing:.02em}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:10px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:4px;min-height:96px}
.tile:hover{border-color:var(--ink)}
.tile b{font-size:1.05rem}
.tile small{color:var(--ink-2)}
.tile .count{justify-self:start}

.steps{display:grid;gap:8px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--tape);color:var(--tape-ink);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span{padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;font-weight:650;color:var(--ink-2)}
.flow span.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.flow span.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.5rem;font-weight:800;font-stretch:85%}
.stat span{color:var(--ink-2);font-size:.82rem}

.sheet-bg{position:fixed;inset:0;background:rgba(5,15,25,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-height:88vh;overflow:auto}
.viewfinder{height:120px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 7px);opacity:.18;position:relative}
.vf-wrap{position:relative}
.vf-wrap p{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:650;font-size:.85rem;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--ink-2);background:var(--paper);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:.8rem;text-align:left}
.chip b{display:block;font-stretch:80%}
.chip.loc{border-style:solid;border-color:var(--tape)}

.banner{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:50;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));color:#fff;display:grid;gap:2px;text-align:center}
.banner b{font-size:1.6rem;font-weight:800;font-stretch:80%;letter-spacing:.01em}
.banner.ok{background:#1F7A4D}.banner.bad{background:#B83227}.banner.info{background:#1E5C96}
@media (prefers-reduced-motion:no-preference){.banner{animation:drop .18s ease-out}}
@keyframes drop{from{transform:translateY(-12px);opacity:.4}to{transform:none;opacity:1}}
.progress{height:8px;border-radius:99px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
tr.done td{background:var(--ok-bg)}
.note{border-left:4px solid var(--tape);padding:8px 12px;background:var(--paper);border-radius:0;font-size:.88rem}
</style>

const esc = s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf = new Intl.NumberFormat('id-ID',{maximumFractionDigits:3});
const q = n=>nf.format(n);
const rp = n=>'Rp '+new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Math.round(n));
const prod = k=>P.find(p=>p.sku===k||p.bc===k||p.sku.toLowerCase()===String(k).toLowerCase());
const batch = id=>S.batches.find(b=>b.id===id);
const days = d=>Math.round((new Date(d+'T00:00:00')-TODAY)/864e5);
const fdate = d=>d?new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'–';
const yymm = ()=>{const d=new Date();return String(d.getFullYear()).slice(2)+String(d.getMonth()+1).padStart(2,'0')};
const docno = p=>`${p}-${yymm()}-${String(++S.seq[p]).padStart(4,'0')}`;
const locsOf = wh=>LOCS[wh].map(([c,k])=>({id:wh+':'+c,code:c,kind:k}));
function balOf(b,l){return S.bal[b+'|'+l]||0}
function move(b,l,qty,type,doc,note){
  const k=b+'|'+l; const nv=(S.bal[k]||0)+qty;
  if(nv<0) throw new Error(`Stok tidak cukup: ${batch(b).sku} batch ${batch(b).no} di ${l.split(':')[1]}`);
  S.bal[k]=nv;
  S.moves.push({t:new Date(),wh:l.split(':')[0],loc:l.split(':')[1],sku:batch(b).sku,batch:batch(b).no,qty,type,doc,note,by:roleName()});
}
function roleName(){return {owner:'Pak Owner',supervisor:'Bu Supervisor',gudang:'Mas Gudang',sales:'Mbak Sales',finance:'Bu Finance'}[S.role]}
/* HPP & nilai stok hanya untuk owner, supervisor/PIC gudang, dan finance */
const seeCost=()=>['owner','supervisor','finance'].includes(S.role);
const isLead=()=>['owner','supervisor'].includes(S.role);
function expBadge(exp){ if(!exp) return ''; const d=days(exp);
  if(d<0) return `<span class="badge b-bad">Kedaluwarsa</span>`;
  if(d<=90) return `<span class="badge b-warn">${d} hari lagi</span>`; return `<span class="badge b-neu">${fdate(exp)}</span>`}
function stockRows(wh){ const out=[];
  for(const k in S.bal){ const qn=S.bal[k]; if(qn<=0) continue; const [b,l]=k.split('|'); if(wh&&!l.startsWith(wh+':')) continue;
    const bt=batch(+b); out.push({b:+b,loc:l,wh:l.split(':')[0],code:l.split(':')[1],sku:bt.sku,no:bt.no,exp:bt.exp,cost:bt.cost,qty:qn}); }
  return out.sort((a,b)=>a.sku.localeCompare(b.sku)||a.exp.localeCompare(b.exp));
}
function kindOf(loc){const [w,c]=loc.split(':');return (LOCS[w].find(x=>x[0]===c)||[])[1]}
/* FEFO: expired terdekat dulu, lewati kedaluwarsa & karantina */
function fefo(wh,sku,need){
  const c=stockRows(wh).filter(r=>r.sku===sku&&days(r.exp)>=0&&kindOf(r.loc)!=='karantina').sort((a,b)=>a.exp.localeCompare(b.exp));
  const picks=[]; let left=need;
  for(const r of c){ if(left<=0) break; const take=Math.min(r.qty,left); picks.push({b:r.b,loc:r.loc,sku,qty:take,picked:0}); left-=take; }
  return {picks,short:left};
}
/* ================= UMPAN BALIK SCAN ================= */
let actx;
function beep(ok){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); const play=(f,t,d)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=f;o.type=ok?'sine':'square';g.gain.setValueAtTime(.15,actx.currentTime+t);g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+t+d);o.connect(g).connect(actx.destination);o.start(actx.currentTime+t);o.stop(actx.currentTime+t+d+.02)};
  if(ok) play(1320,0,.09); else {play(220,0,.16);play(180,.2,.22)} }catch(e){} try{navigator.vibrate&&navigator.vibrate(ok?40:[120,80,120])}catch(e){} }
let bannerT;
function banner(kind,title,detail){ beep(kind!=='bad'); clearTimeout(bannerT);
  $('#bannerbox').innerHTML=`<div class="banner ${kind}" role="status"><b>${esc(title)}</b>${detail?`<span>${esc(detail)}</span>`:''}</div>`;
  bannerT=setTimeout(()=>$('#bannerbox').innerHTML='',kind==='bad'?3600:2200); }

    <div class="stat"><span>Cek mingguan rak</span><b>${wk.done}/${wk.total}</b></div>
    <div class="stat"><span>Pesanan marketplace baru</span><b>${nNew}</b></div>

/* ---------- Cek mingguan ---------- */
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const n=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-n);const y=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil(((t-y)/864e5+1)/7)}
function weekStatus(wh){ const racks=locsOf(wh).map(l=>l.code); const st=S.weekly[wh]||{};
  const sat=new Date(TODAY); sat.setDate(sat.getDate()+((6-sat.getDay()+7)%7));
  const done=racks.filter(r=>st[r]&&st[r].st!=='menunggu').length; const ins=S.inChecks.filter(i=>i.wh===wh);
  return {week:isoWeek(TODAY),racks,st,total:racks.length,done,left:racks.length-done,deadline:sat.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'short'}),
          overdue:TODAY.getDay()===0, ins, inPending:ins.filter(i=>!i.checked).length}; }
V.mingguan=()=>{ const w=weekStatus(S.wh); const pct=w.total?w.done/w.total*100:0;
  return `<div class="row between"><h2>Cek mingguan · Minggu ${w.week}</h2><span class="badge ${w.left?'b-warn':'b-ok'}">${w.left?`tenggat ${w.deadline}`:'Minggu ini selesai'}</span></div>
  <p class="muted">Setiap minggu semua rak di ${WH[S.wh]} dihitung buta (petugas tidak melihat angka sistem), lalu dicocokkan. Selisih ketahuan di minggu yang sama, jadi tidak menggulung sampai akhir bulan.</p>
  <section class="panel"><div class="row between"><h3>Hitung rak</h3><b>${w.done} dari ${w.total} rak</b></div>
  <div class="progress"><i style="width:${pct}%"></i></div>
  <div class="tbl-wrap"><table><thead><tr><th>Rak</th><th>Status</th><th>Dicek oleh</th><th></th></tr></thead><tbody>
  ${w.racks.map(r=>{const x=w.st[r]; const badge=!x?'<span class="badge b-neu">Belum dihitung</span>':x.st==='cocok'?'<span class="badge b-ok">Cocok</span>':x.st==='selisih'?`<span class="badge b-warn">Selisih ${x.qty>0?'+':''}${q(x.qty)} pcs, disetujui</span>`:'<span class="badge b-info">Menunggu persetujuan</span>';
    return `<tr><td class="code qty">${r}</td><td>${badge}</td><td class="small">${x?esc(x.by)+' · '+esc(x.at):'–'}</td><td class="n">${!x&&['owner','supervisor','gudang'].includes(S.role)?`<button class="btn" data-act="wk-count" data-r="${r}">Hitung</button>`:''}</td></tr>`}).join('')}
  </tbody></table></div></section>
  <section class="panel"><div class="row between"><h3>Verifikasi barang masuk minggu ini</h3><span class="muted small">${w.ins.length-w.inPending} dari ${w.ins.length} terverifikasi</span></div>
  <p class="muted small">Supervisor mencocokkan fisik barang dengan surat jalan supplier dan dokumen barang masuk di sistem.</p>
  ${w.ins.length?`<div class="tbl-wrap"><table><thead><tr><th>Dokumen</th><th>Tanggal</th><th>Pengirim</th><th>Isi</th><th>Status</th></tr></thead><tbody>
  ${w.ins.map(i=>`<tr><td class="code">${i.no}</td><td>${fdate(i.date)}</td><td>${esc(i.partner)}</td><td class="small">${esc(i.items)}</td><td>${i.checked?`<span class="badge b-ok">Cocok</span><div class="muted small">${esc(i.checked)}</div>`:isLead()?`<button class="btn" data-act="wk-in" data-k="${S.inChecks.indexOf(i)}">Tandai cocok</button>`:'<span class="badge b-warn">Menunggu supervisor</span>'}</td></tr>`).join('')}
  </tbody></table></div>`:'<div class="empty">Belum ada barang masuk minggu ini.</div>'}</section>
  ${seeCost()?`<section class="panel"><h3>Riwayat selisih per minggu</h3><p class="muted small">Selisih yang mengecil tiap minggu tandanya disiplin scan berjalan.</p>
  <div class="tbl-wrap"><table><thead><tr><th>Minggu</th><th class="n">Baris selisih</th><th class="n">Nilai selisih (HPP)</th></tr></thead><tbody>
  ${S.weekHist.map(h=>`<tr><td>Minggu ${h.w}</td><td class="n">${h.n}</td><td class="n" style="color:${h.val<0?'var(--bad)':'inherit'}">${rp(h.val)}</td></tr>`).join('')}
  <tr><td><b>Minggu ${w.week} (berjalan)</b></td><td class="n">${S.discrepancies.filter(d=>d.src==='opname'&&d.wh===S.wh).length}</td><td class="n">${rp(S.discrepancies.filter(d=>d.src==='opname'&&d.wh===S.wh).reduce((a,d)=>a+d.val,0))}</td></tr>

V.export=()=>{ const k=S.exp||'stok'; const [label,fn]=DATASETS[k]; const rows=fn(); const cols=rows.length?Object.keys(rows[0]):[];

const scanFab=mode=>`<button class="btn tape scanfab" data-act="scan-open" data-m="${mode}">Scan barcode</button>`;
function openScan(mode){ S.scanMode=mode;
  const locChips= mode==='in'?locsOf(S.wh).map(l=>`<button class="chip loc" data-act="scan-code" data-c="L-${S.wh}-${l.code}"><b>Rak ${l.code}</b>L-${S.wh}-${l.code}</button>`).join(''):'';
  $('#overlay').innerHTML=`<div class="sheet-bg" data-act="scan-close-bg"><div class="sheet" role="dialog" aria-label="Scan barcode">
   <div class="row between"><h3>Scan barcode</h3><button class="btn ghost" data-act="scan-close">Tutup</button></div>
   <div class="vf-wrap"><div class="viewfinder"></div><p>Di HP, kamera belakang terbuka di sini.<br>Di demo, ketuk barcode contoh di bawah.</p></div>
   <form class="row" id="scanform"><label class="field" style="flex:1"><span>Atau ketik / pakai scanner USB</span><input id="scan-in" autocomplete="off" placeholder="Barcode atau SKU"></label><button class="btn primary" style="align-self:end">OK</button></form>
   <div><p class="small muted" style="margin-bottom:6px">Barcode di kardus (contoh):</p><div class="chips">
    ${P.map(p=>`<button class="chip" data-act="scan-code" data-c="${p.bc}"><b>${esc(p.name)}</b>${p.bc}</button>`).join('')}
    <button class="chip" data-act="scan-code" data-c="8990000999999"><b>Barang tak dikenal</b>8990000999999</button>${locChips}
   </div></div></div></div>`;
  setTimeout(()=>$('#scan-in')?.focus(),50);
}
function closeScan(){ $('#overlay').innerHTML=''; }
function onScan(code){ code=String(code).trim(); if(!code) return;
  if(/^L-/.test(code)){ const [,w,...c]=code.split('-'); const loc=w+':'+c.join('-');
    if(S.scanMode==='in'&&w===S.wh){S.inbound.loc=loc; banner('info','Rak '+c.join('-'),'Barang berikutnya ditaruh di sini'); render(); return;}
    banner('bad','BUKAN RAK GUDANG INI','Scan barang, bukan label rak'); return; }
  const p=prod(code);
  if(!p){ banner('bad','BARCODE TIDAK DIKENAL',code+' belum terdaftar di Produk'); return; }
  if(S.scanMode==='in'){ closeScan();
    const known=S.batches.filter(b=>b.sku===p.sku).sort((a,b)=>b.exp.localeCompare(a.exp))[0];
    S.inbound.pending={sku:p.sku,no:known?known.no:'',exp:known?known.exp:'',qty:12}; banner('ok','BENAR · '+p.name,'Isi batch & expired dari label'); render(); return; }
  if(S.scanMode==='pick'){ const pk=S.picking; const lines=pk.picks.filter(x=>x.sku===p.sku);
    if(!lines.length){ banner('bad','SALAH BARANG',p.name+' tidak ada di daftar ambil'); return; }
    const l=lines.find(x=>x.picked<x.qty); if(!l){ banner('bad','KELEBIHAN',p.name+' sudah lengkap. Kembalikan ke rak.'); return; }
    l.picked++; const rem=lines.reduce((a,x)=>a+x.qty-x.picked,0); banner('ok','BENAR · '+p.name,`Rak ${l.loc.split(':')[1]} · batch ${batch(l.b).no} · sisa ${rem}`); render(); return; }
  if(S.scanMode==='count'){ const c=S.count; const bt=S.batches.filter(b=>b.sku===p.sku).find(b=>balOf(b.id,c.loc)>0)||S.batches.find(b=>b.sku===p.sku);
    let l=c.lines.find(x=>x.b===bt.id); if(!l){l={sku:p.sku,b:bt.id,qty:0};c.lines.push(l)} l.qty++; banner('ok','+1 · '+p.name,`Batch ${bt.no} · dihitung ${l.qty}`); render(); return; }
}

const A={};

A['in-addpending']=()=>{ const p=S.inbound.pending; const no=$('#pb-no').value.trim().toUpperCase(), exp=$('#pb-exp').value, qty=+$('#pb-qty').value;
  if(!no) return banner('bad','BATCH WAJIB DIISI','Lihat nomor batch di label kemasan');
  if(!exp) return banner('bad','EXPIRED WAJIB DIISI','Tanggal expired diperlukan untuk FEFO');
  if(!(qty>0)) return banner('bad','JUMLAH TIDAK VALID','Isi jumlah lebih dari 0');
  const ex=S.batches.find(b=>b.sku===p.sku&&b.no===no); if(ex&&ex.exp!==exp) return banner('bad','EXPIRED TIDAK COCOK',`Batch ${no} tercatat expired ${fdate(ex.exp)}`);
  const same=S.inbound.lines.find(l=>l.sku===p.sku&&l.no===no&&l.loc===S.inbound.loc); if(same) same.qty+=qty; else S.inbound.lines.push({sku:p.sku,no,exp,qty,loc:S.inbound.loc});
  S.inbound.pending=null; banner('ok','DITAMBAHKAN',`${prod(p.sku).name} · ${no} · ${qty}`); render(); };
A['in-droppending']=()=>{S.inbound.pending=null;render()};
A['in-del']=d=>{S.inbound.lines.splice(+d.i,1);render()};
A['in-cancel']=()=>{S.inbound=null;S.view='gudang';render()};
A['in-post']=()=>{ const d=S.inbound; d.source=$('#in-src').value;
  d.lines.forEach(l=>{ let b=S.batches.find(x=>x.sku===l.sku&&x.no===l.no); if(!b){ b={id:S.batches.length+1,sku:l.sku,no:l.no,exp:l.exp,cost:prod(l.sku).cost}; S.batches.push(b);} move(b.id,l.loc,l.qty,'masuk',d.no,$('#in-partner').value); });
  S.history.push(d.no); S.inChecks.push({no:d.no,wh:S.wh,date:new Date().toISOString().slice(0,10),partner:$('#in-partner').value,items:d.lines.length+' baris · '+q(d.lines.reduce((a,l)=>a+l.qty,0))+' pcs',checked:null}); banner('ok','BARANG MASUK DIPOSTING',`${d.no} · ${d.lines.length} baris`); S.inbound=null; S.view='stok'; render(); };
A['pick-create']=()=>{ const ids=[...document.querySelectorAll('.ordsel:checked')].map(x=>x.value); if(!ids.length) return banner('bad','PILIH PESANAN','Centang minimal satu pesanan');
  const need={}; S.orders.filter(o=>ids.includes(o.id)).forEach(o=>o.lines.forEach(l=>{ (S.mapping[l.sku]||[{sku:l.sku,mult:1}]).forEach(m=>need[m.sku]=(need[m.sku]||0)+l.qty*m.mult); }));
  const picks=[], short=[]; for(const sku in need){ const r=fefo(S.wh,sku,need[sku]); picks.push(...r.picks); if(r.short>0) short.push(`${sku} kurang ${r.short}`); }
  if(short.length) return banner('bad','STOK SIAP KIRIM TIDAK CUKUP',short.join('; '));
  S.picking={no:docno('OUT'),orders:ids,picks,manual:false}; S.orders.forEach(o=>{if(ids.includes(o.id)) o.status='diproses'}); render(); };
A['pk-manual']=()=>{S.picking.manual=$('#pk-manual').checked};
A['pick-cancel']=()=>{ S.orders.forEach(o=>{if(S.picking.orders.includes(o.id)) o.status='baru'}); S.picking=null; render(); };
A['pick-post']=()=>{ const pk=S.picking; const left=pk.picks.filter(p=>p.picked<p.qty);
  if(left.length&&!pk.manual) return banner('bad','BELUM SEMUA DI-SCAN',left.map(p=>`${p.sku} kurang ${p.qty-p.picked}`).join('; '));
  pk.picks.forEach(p=>move(p.b,p.loc,-p.qty,'keluar',pk.no,'marketplace'+(pk.manual?' (manual)':'')));
  S.orders.forEach(o=>{if(pk.orders.includes(o.id)) o.status='dikirim'}); banner('ok','BARANG KELUAR SELESAI',`${pk.no} · ${pk.orders.length} pesanan dikirim`); S.picking=null; render(); };
A['tr-create']=()=>{ const to=$('#tr-to').value, sku=$('#tr-sku').value, qty=+$('#tr-qty').value; const r=fefo(S.wh,sku,qty);
  if(!(qty>0)) return banner('bad','JUMLAH TIDAK VALID','');
  if(r.short>0) return banner('bad','STOK TIDAK CUKUP',`${sku} kurang ${r.short}`);
  const no=docno('TRF'); r.picks.forEach(p=>move(p.b,p.loc,-p.qty,'transfer_keluar',no,'ke '+to));
  S.transfer={no,from:S.wh,to,status:'dikirim',lines:r.picks}; banner('ok','TRANSFER DIKIRIM',`${no} · stok ${S.wh} berkurang`); render(); };
A['tr-receive']=()=>{ const t=S.transfer; const loc=$('#tr-loc').value, note=$('#tr-note').value.trim(); const rcv=t.lines.map((l,i)=>Math.max(0,Math.min(l.qty,+$('#tr-rcv-'+i).value||0)));
  const short=t.lines.some((l,i)=>rcv[i]<l.qty); if(short&&!note) return banner('bad','ISI KETERANGAN SELISIH','Jumlah diterima kurang dari yang dikirim');
  t.lines.forEach((l,i)=>{ if(rcv[i]>0) move(l.b,loc,rcv[i],'transfer_masuk',t.no,'dari '+t.from); if(rcv[i]<l.qty){const bt=batch(l.b);S.discrepancies.push({src:'transfer',doc:t.no,wh:t.to,sku:l.sku,no:bt.no,qty:rcv[i]-l.qty,val:(rcv[i]-l.qty)*bt.cost,reason:note,by:roleName()})} });
  S.transfer=null; banner('ok','TRANSFER DITERIMA',short?'Selisih tercatat di laporan':'Semua sesuai'); render(); };
A['mv-go']=()=>{ const [b,from]=$('#mv-src').value.split('|'), to=$('#mv-to').value, qty=+$('#mv-qty').value;
  if(from===to) return banner('bad','RAK SAMA','Pilih rak tujuan lain'); if(!(qty>0)) return banner('bad','JUMLAH TIDAK VALID','');

A['op-start']=()=>{ S.count={no:docno('OPN'),loc:$('#op-loc').value,lines:[]}; render(); };
A['wk-count']=d=>{ if(S.count||S.pendingCount) return banner('bad','SELESAIKAN OPNAME BERJALAN','Masih ada opname yang belum selesai'); S.count={no:docno('OPN'),loc:S.wh+':'+d.r,lines:[]}; S.view='gudang/opname'; render(); };
A['wk-in']=d=>{ S.inChecks[+d.k].checked=roleName()+' · hari ini'; banner('ok','BARANG MASUK TERVERIFIKASI',S.inChecks[+d.k].no); render(); };
function wkSet(loc,obj){ const [w,r]=loc.split(':'); (S.weekly[w]=S.weekly[w]||{})[r]=obj; }
A['op-set']=(d,e)=>{};
A['op-cancel']=()=>{S.count=null;render()};
A['op-submit']=()=>{ const c=S.count; document.querySelectorAll('[data-act="op-set"]').forEach(inp=>c.lines[+inp.dataset.i].qty=Math.max(0,+inp.value||0));
  stockRows(S.wh).filter(r=>r.loc===c.loc).forEach(r=>{ if(!c.lines.find(l=>l.b===r.b)) c.lines.push({sku:r.sku,b:r.b,qty:0,auto:true}); });
  c.lines.forEach(l=>l.sys=balOf(l.b,c.loc)); S.pendingCount=c; S.count=null; wkSet(c.loc,{st:'menunggu',by:roleName(),at:'hari ini'}); const n=c.lines.filter(l=>l.qty!==l.sys).length;
  banner(n?'info':'ok',n?`${n} BARIS SELISIH`:'SEMUA COCOK',n?'Isi alasan, lalu tunggu persetujuan':'Tetap perlu disetujui'); render(); };
function readReasons(){ S.pendingCount.lines.forEach((l,i)=>{const s=$('#op-r-'+i); if(s) l.reason=s.value}); }
A['op-savereason']=()=>{ readReasons(); banner('ok','ALASAN DISIMPAN','Menunggu persetujuan supervisor'); };
A['op-reopen']=()=>{ const c=S.pendingCount; c.lines=c.lines.filter(l=>!l.auto); S.count=c; S.pendingCount=null; render(); };
A['op-approve']=()=>{ readReasons(); const c=S.pendingCount; const miss=c.lines.filter(l=>l.qty!==l.sys&&!l.reason);
  if(miss.length) return banner('bad','ALASAN BELUM LENGKAP',`${miss.length} baris selisih tanpa alasan`);
  c.lines.forEach(l=>{ const d=l.qty-l.sys; if(d){ move(l.b,c.loc,d,'opname',c.no,l.reason); const bt=batch(l.b); S.discrepancies.push({src:'opname',doc:c.no,wh:c.loc.split(':')[0],sku:l.sku,no:bt.no,qty:d,val:d*bt.cost,reason:l.reason,by:roleName()}) } });
  const diff=c.lines.reduce((a,l)=>a+l.qty-l.sys,0), any=c.lines.some(l=>l.qty!==l.sys);
  wkSet(c.loc,{st:any?'selisih':'cocok',qty:diff,by:roleName(),at:'hari ini'});

A['mp-store']=d=>{S.store=d.s;S.lastImport='';render()};
function moPost(m){ if(m.b){ move(m.b,m.loc,-m.qty,'keluar',m.no,MO_PURPOSE[m.purpose]+': '+m.note); }
  else { const r=fefo(m.wh,m.sku,m.qty); if(r.short>0) throw new Error(`Stok siap kirim ${m.sku} kurang ${r.short}`); r.picks.forEach(p=>move(p.b,p.loc,-p.qty,'keluar',m.no,MO_PURPOSE[m.purpose]+': '+m.note)); } }
A['mo-submit']=()=>{ const purpose=$('#mo-purpose').value, sku=$('#mo-sku').value, bsel=$('#mo-batch').value, qty=+$('#mo-qty').value, note=$('#mo-note').value.trim();
  if(!(qty>0)) return banner('bad','JUMLAH TIDAK VALID','Isi jumlah lebih dari 0');
  if(!note) return banner('bad','KETERANGAN WAJIB','Tulis alasan barang dikeluarkan');
  const m={no:docno('OUT'),wh:S.wh,purpose,sku,qty,note,by:roleName(),status:'pending'};
  if(bsel!=='fefo'){ const [b,loc]=bsel.split('|'); m.b=+b; m.loc=loc; const bt=batch(m.b);
    if(days(bt.exp)<0&&purpose!=='rusak_musnah') return banner('bad','BATCH KEDALUWARSA','Batch kedaluwarsa hanya boleh keluar untuk dimusnahkan');
    if(balOf(m.b,loc)<qty) return banner('bad','STOK TIDAK CUKUP',`Batch ${bt.no} di rak ${loc.split(':')[1]} hanya ${balOf(m.b,loc)}`); }
  if(S.role==='gudang'){ S.manualOut.unshift(m); banner('info','DIAJUKAN KE SUPERVISOR',`${m.no} · stok belum berkurang`); render(); return; }
  try{ moPost(m); m.status='posted'; m.approver='Langsung oleh '+roleName(); S.manualOut.unshift(m); banner('ok','BARANG KELUAR',`${m.no} · ${qty} ${prod(sku).name}`); render(); }catch(e){ banner('bad','GAGAL',e.message) } };
A['mo-approve']=d=>{ const m=S.manualOut.find(x=>x.no===d.no); try{ moPost(m); m.status='posted'; m.approver='Disetujui '+roleName(); banner('ok','DISETUJUI',`${m.no} · stok berkurang`); render(); }catch(e){ banner('bad','GAGAL',e.message) } };
A['mo-reject']=d=>{ const m=S.manualOut.find(x=>x.no===d.no); m.status='ditolak'; banner('info','DITOLAK',`${m.no} · stok tidak berubah`); render(); };
A['mp-import']=()=>{ let nw=0,dup=0,bt=0; const groups={}; const st=S.store||'zdo', SAMPLE=STORES[st].rows;
  SAMPLE.forEach(r=>{(groups[r[0]]=groups[r[0]]||{id:r[0],store:st,status:r[1],buyer:r[2],lines:[]}).lines.push({sku:r[3],name:r[4],qty:r[5],price:r[6]})});
  Object.values(groups).forEach(g=>{ if(S.orders.find(o=>o.id===g.id)){dup++;return} const cancel=/batal|cancel/i.test(g.status); if(cancel) bt++;
    S.orders.push({...g,date:new Date().toISOString().slice(0,10),status:cancel?'batal':'baru'}); nw++; });
  const um=[...new Set(S.orders.filter(o=>o.status!=='batal').flatMap(unmapped))];
  S.lastImport= nw?`${SAMPLE.length} baris → ${nw} pesanan baru (${bt} batal), ${um.length} SKU belum dipetakan (${um.join(', ')}).`:`${dup} pesanan sudah pernah diimpor, dilewati. Tidak ada pesanan dobel.`;
  S.importedOnce=true; banner(nw?'ok':'info',nw?'IMPOR BERHASIL':'TIDAK ADA YANG DOBEL',S.lastImport); render(); };
A['map-save']=d=>{ S.mapping[d.s]=[{sku:$('#map-'+d.s).value,mult:+$('#mult-'+d.s).value||1}]; banner('ok','SKU DIPETAKAN',`${d.s} → ${prod(S.mapping[d.s][0].sku).name}`); render(); };
A['so-new']=()=>{ const so={no:docno('SO'),cust:$('#so-c').value,wh:S.wh,lines:[{sku:$('#so-p').value,qty:+$('#so-q').value,price:+$('#so-h').value}],tax:11,status:'draft'};
  if(!(so.lines[0].qty>0)) return banner('bad','QTY TIDAK VALID',''); S.sos.unshift(so); banner('ok','SO DIBUAT',so.no); render(); };
A['so-confirm']=d=>{ const so=S.sos[+d.i]; const c=S.customers.find(x=>x.code===so.cust); const tot=so.lines.reduce((a,l)=>a+l.qty*l.price,0)*(1+so.tax/100);
  const out=S.invoices.filter(i=>i.cust===so.cust&&i.status!=='lunas').reduce((a,i)=>a+i.total-i.paid,0);
  if(out+tot>c.limit) return banner('bad','MELEBIHI LIMIT KREDIT',`Piutang ${rp(out)} + order ${rp(tot)} > limit ${rp(c.limit)}`);
  so.status='confirmed'; banner('ok','SO DIKONFIRMASI','Gudang bisa mengirim'); render(); };
A['so-ship']=d=>{ const so=S.sos[+d.i]; const out=docno('OUT'); const all=[];
  for(const l of so.lines){ const r=fefo(so.wh,l.sku,l.qty); if(r.short>0) return banner('bad','STOK TIDAK CUKUP',`${l.sku} kurang ${r.short}`); all.push(...r.picks); }
  all.forEach(p=>move(p.b,p.loc,-p.qty,'keluar',out,'B2B '+so.no)); so.status='dikirim'; banner('ok','BARANG DIKIRIM',`${out} · batch dipilih FEFO`); render(); };
A['so-invoice']=d=>{ const so=S.sos[+d.i]; const c=S.customers.find(x=>x.code===so.cust); const tot=Math.round(so.lines.reduce((a,l)=>a+l.qty*l.price,0)*(1+so.tax/100));
  const date=new Date().toISOString().slice(0,10); const due=new Date(Date.now()+c.terms*864e5).toISOString().slice(0,10);
  S.invoices.unshift({no:docno('INV'),cust:so.cust,date,due,total:tot,paid:0,status:'belum_lunas',so:so.no}); banner('ok','FAKTUR DIBUAT',`Jatuh tempo ${c.terms} hari`); render(); };
A['inv-pay']=d=>{ const i=S.invoices.find(x=>x.no===d.no); i.paid=i.total; i.status='lunas'; banner('ok','PEMBAYARAN DICATAT',`${i.no} lunas`); render(); };
A['exp-copy']=()=>{ const [,fn]=DATASETS[S.exp||'stok']; const rows=fn(); if(!rows.length) return banner('bad','TIDAK ADA DATA','');
  const cols=Object.keys(rows[0]); const csv=[cols.join(','),...rows.map(r=>cols.map(c=>{const v=r[c];return typeof v==='number'?v:'"'+String(v??'').replace(/"/g,'""')+'"'}).join(','))].join('\n');
  const ok=()=>banner('ok','CSV DISALIN',`${rows.length} baris. Tempel di Excel / Google Sheets`);
  try{ navigator.clipboard.writeText(csv).then(ok,()=>banner('bad','GAGAL MENYALIN','Browser menolak akses clipboard')); }catch(e){ banner('bad','GAGAL MENYALIN','') } };

/* ================= RENDER ================= */
function back(v,l='Operasi gudang'){return `<button class="btn ghost" data-act="go" data-v="${v}" style="justify-self:start">← ${l}</button>`}
function render(){ if(!allowed(S.view.split('/')[0])) S.view='home'; renderMenu(); $('#view').innerHTML=(V[S.view]||V.home)(); }
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const a=A[el.dataset.act]; if(!a) return;
  if(el.tagName==='INPUT'&&el.type!=='checkbox') return; if(el.tagName!=='INPUT') e.preventDefault(); try{ a(el.dataset,e) }catch(err){ banner('bad','GAGAL',err.message) } });
document.addEventListener('submit',e=>{ if(e.target.id==='scanform'){ e.preventDefault(); const v=$('#scan-in').value; $('#scan-in').value=''; onScan(v); } });
document.addEventListener('input',e=>{ if(e.target.id==='stok-q'){ S.stokQ=e.target.value; const pos=e.target.selectionStart; render(); const i=$('#stok-q'); i.focus(); i.setSelectionRange(pos,pos);} });
document.addEventListener('change',e=>{ if(e.target.id==='exp-k'){S.exp=e.target.value;render()} if(e.target.id==='mo-sku'){S.moSku=e.target.value;S.moPurpose=$('#mo-purpose').value;render()} });
$('#role').addEventListener('change',e=>{ S.role=e.target.value; render(); banner('info','Masuk sebagai '+e.target.selectedOptions[0].text,'Menu menyesuaikan peran'); });
$('#whsel').innerHTML=Object.entries(WH).map(([k,v])=>`<option value="${k}">${v}</option>`).join('');
$('#whsel').addEventListener('change',e=>{ S.wh=e.target.value; render(); });
seed(); render();
</script>
