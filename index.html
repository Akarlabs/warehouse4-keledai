<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Warehouse Sistem 4 Keledai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap">
<style>
/* Layout: gudang WBA — header terang berlogo Winwin, menu kiri (desktop) / tab atas (HP), satu aksi hijau "Scan".
   Token dari design system Winwin Berkah Amanah; layar loading dari WBA Design System (Loading · Denyut). */
:root{
  --paper:#f4f4f4; --surface:#ffffff; --ink:#323d3c; --ink-2:#5c6968; --line:#dcdce4; --line-strong:#7d8a88;
  --brand:#427a55; --brand-deep:#2f5a3e; --on-brand:#ffffff; --tint:#e3eee7;
  --royal:#044cac; --on-royal:#ffffff; --azure:#0072c0; --on-azure:#ffffff;
  --ok:#2f5a3e; --ok-bg:#e3eee7; --bad:#B83227; --bad-bg:#FBE7E4;
  --warn:#9A6400; --warn-bg:#FDF1D8; --info:#044cac; --info-bg:#E2EEF9;
  --logo-mark:#427a55; --logo-word:#323d3c;
  --f:"Figtree", "Segoe UI", system-ui, sans-serif; --fd:"Montserrat", "Segoe UI", system-ui, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0e1f17; --surface:#152a20; --ink:#eef3f0; --ink-2:#a9b8b1; --line:#2b4337; --line-strong:#6f877b;
  --brand:#7cc495; --brand-deep:#a5d9b8; --on-brand:#0e1f17; --tint:#1b3a2a;
  --royal:#7fa8f0; --on-royal:#0e1f17; --azure:#5db4f0; --on-azure:#0e1f17;
  --ok:#7cc495; --ok-bg:#1b3a2a; --bad:#F07F72; --bad-bg:#3A1714;
  --warn:#F0B85A; --warn-bg:#33260C; --info:#7fa8f0; --info-bg:#142B42;
  --logo-mark:#ffffff; --logo-word:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0e1f17; --surface:#152a20; --ink:#eef3f0; --ink-2:#a9b8b1; --line:#2b4337; --line-strong:#6f877b;
  --brand:#7cc495; --brand-deep:#a5d9b8; --on-brand:#0e1f17; --tint:#1b3a2a;
  --royal:#7fa8f0; --on-royal:#0e1f17; --azure:#5db4f0; --on-azure:#0e1f17;
  --ok:#7cc495; --ok-bg:#1b3a2a; --bad:#F07F72; --bad-bg:#3A1714;
  --warn:#F0B85A; --warn-bg:#33260C; --info:#7fa8f0; --info-bg:#142B42;
  --logo-mark:#ffffff; --logo-word:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--azure);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h2{font-family:var(--fd);font-size:1.3rem;font-weight:800;text-transform:uppercase;letter-spacing:.01em;color:var(--royal)}
h3{font-size:1.05rem;font-weight:700}
.wba-mark{fill:var(--logo-mark)}.wba-word{fill:var(--logo-word)}
p{margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);color:var(--ink);border-bottom:3px solid var(--azure)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brandmark{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:60px;height:37px;flex:none;display:block}
.brandmark b{font-family:var(--fd);font-weight:800;font-size:1rem;text-transform:uppercase;letter-spacing:.01em;display:block;line-height:1.15;color:var(--royal)}
.brandmark small{color:var(--ink-2);font-size:.75rem}
.top label{font-size:.72rem;color:var(--ink-2);display:block}
.top select{background:var(--surface);border:1px solid var(--line-strong);color:var(--ink);border-radius:4px;padding:5px 8px;min-width:0}
.demo-pill{background:var(--azure);color:var(--on-azure);font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 10px}

/* Shell */
.shell{display:grid;grid-template-columns:1fr;gap:0;max-width:1240px;margin:0 auto}
nav.menu{display:flex;gap:6px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface)}
nav.menu button{flex:none;border:1px solid var(--line);background:transparent;border-radius:9999px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--ink-2);white-space:nowrap}
nav.menu button[aria-current="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
nav.menu .grp{display:none}
main{padding-block:18px 120px;min-width:0;display:grid;gap:18px;align-content:start}
@media (min-width:900px){
  .shell{grid-template-columns:230px minmax(0,1fr)}
  nav.menu{flex-direction:column;overflow:visible;border-bottom:0;border-right:1px solid var(--line);min-height:calc(100vh - 70px);padding:18px 12px;position:sticky;top:70px;align-self:start;background:transparent}
  nav.menu button{text-align:left;border:0;padding:8px 12px}
  nav.menu .grp{display:block;font-size:.72rem;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;padding:12px 12px 2px}
  main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
}

/* Elements */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:650;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--royal);color:var(--on-royal);border-color:var(--royal)}
.btn.tape{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:800}
.btn.primary:hover{border-color:var(--royal)}.btn.tape:hover{background:var(--brand-deep);border-color:var(--brand-deep)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline;padding-inline:4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.78rem;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:9px 10px;min-height:42px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.badge{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-warn{background:var(--warn-bg);color:var(--warn)}.b-info{background:var(--info-bg);color:var(--info)}
.b-neu{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-weight:700;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);background:var(--paper);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.qty{font-weight:800;font-size:1.05rem}
.code{font-weight:700;font-stretch:80%;letter-spacing:.02em}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:10px}

/* Tiles gudang */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:4px;min-height:96px}
.tile:hover{border-color:var(--brand)}
.tile b{font-size:1.05rem}
.tile small{color:var(--ink-2)}
.tile .count{justify-self:start}

/* Alur langkah */
.steps{display:grid;gap:8px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--azure);color:var(--on-azure);display:grid;place-items:center;font-family:var(--fd);font-weight:800;font-size:.8rem}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span{padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;font-weight:650;color:var(--ink-2)}
.flow span.on{background:var(--royal);color:var(--on-royal);border-color:var(--royal)}
.flow span.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}

/* Stat */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.stat b{display:block;font-family:var(--fd);font-size:1.5rem;font-weight:800;line-height:1.15;color:var(--brand)}
.stat span{color:var(--ink);font-weight:700;font-size:.82rem}

/* Scan */
.scanfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:1.05rem;padding:14px 22px;border-radius:99px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,25,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-height:88vh;overflow:auto}
.viewfinder{height:120px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 7px);opacity:.18;position:relative}
.vf-wrap{position:relative}
.vf-wrap p{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:650;font-size:.85rem;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--ink-2);background:var(--paper);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:.8rem;text-align:left}
.chip b{display:block;font-stretch:80%}
.chip.loc{border-style:solid;border-color:var(--azure)}

/* Banner hasil scan: elemen yang paling penting untuk staf */
.banner{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:50;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));color:#fff;display:grid;gap:2px;text-align:center}
.banner b{font-family:var(--fd);font-size:1.45rem;font-weight:800;letter-spacing:.01em}
.banner.ok{background:#2f5a3e}.banner.bad{background:#B83227}.banner.info{background:#044cac}
@media (prefers-reduced-motion:no-preference){.banner{animation:drop .18s ease-out}}
@keyframes drop{from{transform:translateY(-12px);opacity:.4}to{transform:none;opacity:1}}
.progress{height:8px;border-radius:99px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--brand)}
tr.done td{background:var(--ok-bg)}
.note{padding:10px 14px;background:var(--tint);color:var(--ink);border-radius:8px;font-size:.88rem}

/* --- tambahan aplikasi gabungan --- */
.stat b{white-space:nowrap;font-size:clamp(1rem,4.1vw,1.5rem)}
.menu-foot{margin-top:auto;padding:12px;display:none}
@media (min-width:900px){.menu-foot{display:block}}
.who{display:flex;gap:8px;align-items:center;font-size:.8rem;color:var(--ink-2);padding:6px 12px}
.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pipe .step{border:1px solid var(--line);border-radius:16px;padding:10px 12px;background:var(--surface);text-align:left;cursor:pointer}
.pipe .step b{display:block;font-family:var(--fd);font-size:1.6rem;font-weight:800;color:var(--brand)}
.pipe .step span{font-size:.8rem;color:var(--ink-2)}
.pipe .step.hot{border-color:var(--azure);box-shadow:inset 0 0 0 1px var(--azure);background:var(--info-bg)}
.skuin{display:flex;gap:8px;align-items:end}
.skuin .field{flex:1}
.skuin .btn{flex:none}
.scanbtn{background:var(--brand);color:var(--on-brand);border-color:var(--brand);font-weight:800}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#06121d;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;inset:18% 12%;border:3px solid #5db4f0;border-radius:10px;pointer-events:none}
.cam .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:16px;font-weight:600;font-size:.9rem}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photo-drop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.label{border:1px dashed var(--ink-2);border-radius:8px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:#fff;color:#111}
.label .qr{width:84px;height:84px}
.label .qr img,.label .qr canvas{width:84px!important;height:84px!important}
.label b{font-size:1.05rem;font-stretch:80%;letter-spacing:.02em;display:block;word-break:break-all}
.label small{font-size:.72rem;line-height:1.25;display:block}
.pill-nav{display:flex;gap:6px;flex-wrap:wrap}
.pill-nav button{border:1px solid var(--line-strong);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600}
.pill-nav button[aria-pressed="true"]{background:var(--royal);color:var(--on-royal);border-color:var(--royal)}
.chk{display:flex;gap:8px;align-items:center;font-size:.88rem}
.chk input{width:20px;height:20px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--ink-2)}.kv dd{margin:0}
/* Loading WBA (Denyut): hanya saat belum ada data di perangkat; kartu selalu putih karena logo dibuat untuk latar terang */
#boot{position:fixed;inset:0;z-index:60;background:var(--paper);display:grid;place-items:center;padding:16px;transition:opacity .4s}
#boot.out{opacity:0;pointer-events:none}
#boot .card{background:#fff;border:1.5px solid #2b2f45;border-radius:14px;width:100%;max-width:300px;padding:30px 28px 24px;display:grid;justify-items:center;gap:18px}
#boot .card svg{height:110px;width:auto;--logo-mark:#427a55;--logo-word:#323d3c;animation:denyut 1.6s ease-in-out infinite}
#boot .bar{width:100%;height:4px;background:#dfe3ea;border-radius:99px;overflow:hidden;position:relative}
#boot .bar i{position:absolute;top:0;bottom:0;width:38%;background:#0072c0;border-radius:99px;animation:geser 1.4s ease-in-out infinite}
#boot p{font-size:.8rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#044cac;text-align:center}
@keyframes denyut{0%,100%{opacity:.85;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
@keyframes geser{from{left:-38%}to{left:100%}}
@media (prefers-reduced-motion:reduce){#boot{transition:none}#boot .card svg,#boot .bar i{animation:none}#boot .bar i{left:0;width:100%}}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;inset:0;padding:8mm}
  .label{break-inside:avoid;border-color:#999}
}
</style>
<style>
/* --- penyesuaian aplikasi resmi (Supabase) ke desain yang sama --- */
:root{--line2:var(--line-strong);--bg:var(--surface)}
.pic img,.pthumb img{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
.pthumb{width:44px;height:44px;border-radius:10px;background:var(--tint);color:var(--brand);display:grid;place-items:center;overflow:hidden;flex:none}.pthumb svg{width:26px;height:26px}
.pcell{display:flex;gap:10px;align-items:center}
[hidden]{display:none!important}
a{color:var(--royal)}
h1{font-family:var(--fd);font-size:1.3rem;font-weight:800;text-transform:uppercase;letter-spacing:.01em;color:var(--royal)}
.panel h2,.auth h2{font-family:var(--f);font-size:1.05rem;font-weight:700;text-transform:none;letter-spacing:0;color:var(--ink)}
.panel.hl{border:2px solid var(--azure)}
.between{justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
.n{text-align:right}.pre{white-space:pre-line}
.btn.sm{min-height:36px;padding:6px 10px;font-size:.88rem}
.top-who{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top-who .nm{font-size:.82rem;color:var(--ink-2);text-align:right;line-height:1.25}.top-who .nm b{display:block;color:var(--ink)}
.menu-foot .who{display:block;padding:6px 12px}
.auth{max-width:440px;margin:7vh auto;padding:0 16px;display:grid;gap:16px}
.auth .brandmark{margin:0}
.grid1{display:grid;gap:12px}.btn.big{min-height:52px;font-size:1.05rem}.center{text-align:center}
.linkbtn{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer;font:inherit;padding:8px}
button.stat{text-align:left;cursor:pointer;font:inherit;color:inherit}button.stat:hover{border-color:var(--brand)}button.stat small{color:var(--ink-2);font-size:.75rem}
.pwwrap{position:relative;display:block}.pwwrap input{padding-right:64px!important}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--royal);font:inherit;font-size:.8rem;font-weight:700;cursor:pointer;padding:6px 8px}
.pcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;grid-template-columns:48px 1fr auto;gap:6px 12px;align-items:center;background:var(--surface)}
.pcard.warn{border-color:var(--warn)}.pcard.bad{border-color:var(--bad)}
.pcard .pic{width:48px;height:48px;border-radius:12px;background:var(--tint);color:var(--brand);display:grid;place-items:center}.pcard .pic svg{width:30px;height:30px}
.pcard .pinfo{min-width:0;display:grid}.pcard .pinfo b{line-height:1.25}
.pcard .ptot{text-align:right;line-height:1}.pcard .ptot b{display:block;font-family:var(--fd);font-weight:800;font-size:1.6rem;color:var(--brand)}.pcard .ptot span{font-size:.75rem;color:var(--ink-2)}
.pcard .peds{grid-column:1/-1;display:grid;gap:4px;border-top:1px dashed var(--line);padding-top:8px}
.ped{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem}
.rolechips{display:flex;flex-wrap:wrap;gap:6px}.rolechips span{font-size:.78rem;font-weight:650;padding:3px 10px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2)}
</style>
</head>

async function fetchAll(view,build,order,onProg){
  const mk=head=>{let qy=sb.from(view).select('*',head?{count:'exact',head:true}:undefined); if(build) qy=build(qy); return qy;};
  const {count,error:ce}=await mk(true); if(ce) throw new Error(errMsg(ce));
  const rows=[]; const size=1000;
  for(let from=0;from<(count||0);from+=size){ let qy=mk(false); order.forEach(o=>{qy=qy.order(o.replace(/^-/,''),{ascending:!o.startsWith('-'),nullsFirst:false})});
    const {data,error}=await qy.range(from,from+size-1); if(error) throw new Error(errMsg(error)); rows.push(...data); onProg&&onProg(rows.length,count); if(data.length<size) break; }

   <div class="row"><button class="btn primary" data-act="sc-live">Buka kamera</button><label class="btn" for="sc-photo" style="display:inline-flex;align-items:center">Foto barcode / QR</label><input id="sc-photo" type="file" accept="image/*" capture="environment" hidden></div>

function closeScanner(){ if(SC?.reader){try{SC.reader.reset()}catch(e){}} SC=null; $('#overlay').innerHTML=''; }
const scMsg=t=>{const m=$('#sc-msg'); if(m){m.hidden=!t; m.textContent=t||'';}};
async function startLive(){ const r=zx(); if(!r) return scMsg('Modul scan belum termuat. Cek internet, atau ketik SKU.');
  if(!navigator.mediaDevices?.getUserMedia) return scMsg('Browser ini tidak mendukung kamera langsung. Pakai "Foto barcode / QR".');
  SC.reader=r; scMsg('Membuka kamera…');
  try{ await r.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},$('#sc-video'),res=>{ if(!res||!SC) return; const t=res.getText(),now=Date.now(); if(t===SC.last&&now-SC.lastT<1800) return; SC.last=t; SC.lastT=now; handleCode(t); });
    scMsg(''); $('#sc-aim').hidden=false;
  }catch(e){ SC.reader=null; try{r.reset()}catch(_){} scMsg(/NotAllowed|Permission/i.test(e.name+e.message)?'Izin kamera ditolak. Izinkan kamera di pengaturan browser, atau pakai "Foto barcode / QR".':'Kamera tidak bisa dibuka. Pakai "Foto barcode / QR".'); } }
function shrink(file,max,type,quality){ return new Promise((ok,bad)=>{ const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{ const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k); c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url); ok(c.toDataURL(type||'image/jpeg',quality||.92)); };
  img.onerror=()=>{URL.revokeObjectURL(url);bad(new Error('Foto tidak bisa dibuka'))}; img.src=url; }); }
async function decodePhoto(file){ scMsg('Membaca foto…');
  try{ const data=await shrink(file,1400);
    if('BarcodeDetector' in window){ try{ const img=new Image(); img.src=data; await img.decode(); const r=await new BarcodeDetector().detect(img); if(r?.[0]){ scMsg(''); return handleCode(r[0].rawValue); } }catch(e){} }
    const r=zx(); if(!r) throw new Error('modul'); const res=await r.decodeFromImageUrl(data); scMsg(''); handleCode(res.getText());
  }catch(e){ scMsg('Barcode/QR tidak terbaca. Foto lebih dekat & terang, atau ketik SKU.'); beep(false); } }
function handleCode(raw){ if(!SC) return; const code=String(raw).trim(); const m=code.match(/^([A-Za-z0-9._-]+)\s+—/);

  const cards=G.products.filter(p=>p.active||bySku[p.sku]).map(p=>{ const ls=(bySku[p.sku]||[]).slice().sort((a,b)=>String(a.ed||'9').localeCompare(String(b.ed||'9'))); const tot=ls.reduce((a,l)=>a+num(l.qty),0);
    const worst=ls.some(l=>l.ed_status==='kedaluwarsa')?'bad':ls.some(l=>l.ed_status==='dekat')?'warn':tot<=0?'bad':'';
    return `<article class="pcard ${worst}" data-f="${esc((p.sku+' '+p.name).toLowerCase())}"><div class="pic" aria-hidden="true">${prodPic(p)}</div>
     <div class="pinfo"><b>${esc(p.name)}</b><span class="code small muted">${esc(p.sku)}</span></div>
     <div class="ptot"><b>${q(tot)}</b><span>pcs</span></div>
     <div class="peds">${tot<=0?'<span class="badge b-bad">Stok habis</span>':ls.map(l=>`<div class="ped">${edBadge(l.ed,l.ed_status)}<b>${q(l.qty)} pcs</b></div>`).join('')}</div></article>`; }).join('');
  const overview=`<section class="panel"><div class="row between"><h2>Stok barang · ${q(all.reduce((a,l)=>a+num(l.qty),0))} pcs</h2><label class="field" style="min-width:220px"><span>Cari barang</span><input id="home-q" placeholder="ketik nama / SKU" autocomplete="off"></label></div>
   ${cards?`<div class="pcards">${cards}</div>`:'<div class="empty">Belum ada barang. Owner / Head Operasional mengisi produk & stok awal di menu Produk.</div>'}</section>`;
  const stokTbl=`<section class="panel"><div class="row between"><h2>Stok sekarang · ${q(all.reduce((a,l)=>a+num(l.qty),0))} pcs</h2><label class="field" style="min-width:220px"><span>Cari produk</span><input id="home-q" placeholder="ketik nama / SKU" autocomplete="off"></label></div>
   ${allF.length?`<div class="tbl"><table><thead><tr><th>Produk</th><th>SKU</th><th>ED</th><th class="n">Qty (pcs)</th></tr></thead><tbody>${allF.map((l,i)=>`<tr data-f="${esc((l.sku+' '+l.name).toLowerCase())}"><td>${i&&allF[i-1].sku===l.sku?'':`<b>${esc(l.name)}</b>`}</td><td class="code small">${i&&allF[i-1].sku===l.sku?'':esc(l.sku)}</td><td>${edBadge(l.ed,l.ed_status)}</td><td class="n qty">${q(l.qty)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${all.length?'':'Belum ada stok. Owner mengisi produk & stok awal di menu Produk.'}</div>`}</section>`;
  const todo=[];
  if(is('owner')&&d.pending_users) todo.push(['pengguna',`${d.pending_users} akun baru menunggu aktivasi`,'Pilih peran lalu aktifkan']);
  if(is('owner')&&d.pending_out) todo.push(['keluar',`${d.pending_out} barang keluar menunggu persetujuan`,'Sampel / rusak / internal yang diajukan staf']);
  if(d.so_open&&d.so_open.status==='submitted'&&is('owner')) todo.push(['so',`Stock opname ${d.so_open.doc_no} menunggu persetujuan`,'Periksa selisih & alasannya']);
  if(d.so_open&&d.so_open.status==='counting'&&is('owner','staf')) todo.push(['so',`Stock opname ${d.so_open.doc_no} sedang dihitung`,'Lanjutkan hitung lalu kirim']);
  if(!d.so_open&&!d.so_done_this_week&&is('owner','staf')) todo.push(['so',`Stock opname minggu ini (${d.so_week}) belum dilakukan`,'Hitung fisik semua barang, cocokkan dengan sistem']);
  const pendP=G.products.filter(p=>p.approved===false).length; if(is('owner','finance')&&pendP) todo.push(['produk',`${pendP} barang baru menunggu ACC`,'Diajukan staf gudang: cek kode, isi HPP, lalu ACC']);
  if(is('owner','finance')&&d.unverified_in) todo.push(['masuk',`${d.unverified_in} barang masuk belum diverifikasi`,'Cocokkan dengan surat jalan & foto bukti']);
  const soB=d.so_done_this_week?'<span class="badge b-ok count">Selesai</span>':d.so_open?`<span class="badge b-warn count">${d.so_open.status==='submitted'?'Menunggu owner':'Sedang dihitung'}</span>`:'<span class="badge b-warn count">Belum mulai</span>';
  const tiles=is('owner','staf')?`<div class="tiles">
    <button class="tile" data-act="go" data-v="masuk"><b>Terima barang</b><small>Dari supplier, dengan surat jalan & foto</small>${d.in_today?`<span class="badge b-info count">${q(d.in_today)} pcs hari ini</span>`:''}</button>
    <button class="tile" data-act="go" data-v="keluar"><b>Barang keluar</b><small>Pesanan harian, sampel, rusak, internal</small>${d.out_today?`<span class="badge b-info count">${q(d.out_today)} pcs hari ini</span>`:''}${is('owner')&&d.pending_out?`<span class="badge b-warn count">${d.pending_out} menunggu</span>`:''}</button>
    <button class="tile" data-act="go" data-v="so"><b>Cek mingguan</b><small>Hitung stok fisik minggu ini</small>${soB}</button>
    <button class="tile" data-act="go" data-v="stok"><b>Stok & ED</b><small>Cari barang, jumlah & ED</small></button></div>`:'';
  return `<div class="row between"><h1>${{owner:'Dashboard Owner',ops:'Dashboard Head Operasional',staf:'Dashboard Staf Gudang',sales:'Dashboard Sales / Marketplace',finance:'Dashboard Finance'}[role()]}</h1><button class="btn sm" data-act="go" data-v="home">Muat ulang</button></div>
  ${is('staf')?overview+tiles:tiles+stokTbl}
  <div class="stats">
   <button class="stat" data-act="stat" data-k="in_today"><span>Masuk hari ini</span><b>${q(d.in_today)} pcs</b><small>Lihat rincian ›</small></button>
   <button class="stat" data-act="stat" data-k="out_today"><span>Keluar hari ini</span><b>${q(d.out_today)} pcs</b><small>Lihat rincian ›</small></button>
   <button class="stat" data-act="stat" data-k="out_month"><span>Keluar bulan ini</span><b>${q(d.out_month)} pcs</b><small>Lihat rincian ›</small></button>
   <button class="stat" data-act="stat" data-k="total"><span>Total stok</span><b>${q(d.total_qty)} pcs</b><small>Lihat rincian ›</small></button>
   ${seeCost()?`<button class="stat" data-act="stat" data-k="value"><span>Nilai stok (HPP)</span><b>${rp(d.stock_value)}</b><small>Lihat rincian ›</small></button><button class="stat" data-act="stat" data-k="risk"><span>Nilai berisiko ED</span><b style="color:var(--bad)">${rp(d.risk_value)}</b><small>Lihat rincian ›</small></button>`:`<button class="stat" data-act="stat" data-k="risk"><span>Kedaluwarsa / ED dekat</span><b>${q(d.expired_qty)} / ${q(d.near_qty)}</b><small>Lihat rincian ›</small></button>`}
  </div>
  ${todo.length?`<section class="panel"><h2>Perlu dikerjakan</h2><div class="tbl"><table><tbody>${todo.map(t=>`<tr><td><b>${esc(t[1])}</b><div class="small muted">${esc(t[2])}</div></td><td class="n"><button class="btn sm" data-act="go" data-v="${t[0]}">Buka</button></td></tr>`).join('')}</tbody></table></div></section>`:''}
  <section class="panel"><h2>Pantauan ED (≤ ${G.settings?.warn_months||6} bulan)</h2>${lots.length?`<div class="tbl"><table><thead><tr><th>Produk</th><th>ED</th><th class="n">Qty</th>${seeCost()?'<th class="n">Nilai</th>':''}<th>Tindakan</th></tr></thead><tbody>
   ${lots.map(l=>`<tr><td><b>${esc(l.name)}</b><div class="small muted code">${l.sku}</div></td><td>${edBadge(l.ed,l.ed_status)}</td><td class="n qty">${q(l.qty)}</td>${seeCost()?`<td class="n">${rp(l.value)}</td>`:''}<td class="small">${l.ed_status==='kedaluwarsa'?'Pisahkan, keluarkan sebagai "Rusak"':l.days_left<=90?'Habiskan segera (promo/bundling)':'Keluar lebih dulu (otomatis)'}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada produk kedaluwarsa atau mendekati ED.</div>'}</section>
  <section class="panel"><h2>Stok di bawah minimum</h2><p class="small muted">Muncul kalau total stok sebuah produk lebih kecil dari angka <b>Stok minimum</b> yang diisi Owner di menu Produk (mis. minimum 36 pcs, stok tinggal 20 → tampil di sini supaya segera restock).</p>${low.length?`<div class="tbl"><table><thead><tr><th>Produk</th><th class="n">Stok</th><th class="n">Minimum</th></tr></thead><tbody>${low.map(s=>`<tr><td>${esc(s.name)}<div class="small muted code">${s.sku}</div></td><td class="n qty">${q(s.qty)}</td><td class="n">${q(s.min_stock)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Semua stok di atas minimum.</div>'}</section>`; };

let GEN=0;
function newIn(){ return {gen:++GEN,doc_date:today(),source:'supplier',supplier_id:'',sj_no:'',sj_date:today(),noSj:false,no_sj_note:'',note:'',photo:null,lines:[]}; }
V.masuk=async()=>{ const canIn=is('owner','staf'); if(canIn&&!G.ui.inD) G.ui.inD=newIn(); const d=G.ui.inD; const page=G.ui.inPage||1;
  const list=await sel('v_inbounds',x=>x.order('created_at',{ascending:false}).range(0,page*30-1));
  const sel_=prod((G.ui['in-sku']||'').split(' — ')[0]);
  return `<h1>Barang masuk</h1>
  ${canIn?`<section class="panel"><h2>1. Dokumen penerimaan</h2><div class="grid">
   <label class="field"><span>Sumber</span><select id="in-source" data-gen="${d.gen}">${Object.entries(SOURCE).filter(([k])=>k!=='saldo_awal'||is('owner')).map(([k,v])=>`<option value="${k}" ${d.source===k?'selected':''}>${v}</option>`).join('')}</select></label>
   <label class="field"><span>Tanggal terima</span><input id="in-date" type="date" value="${d.doc_date}"></label>
   <label class="field"><span>Supplier</span><select id="in-sup"><option value="">— pilih —</option>${G.suppliers.filter(s=>s.active).map(s=>`<option value="${s.id}" ${d.supplier_id===s.id?'selected':''}>${esc(s.name)}</option>`).join('')}<option value="__new">+ Supplier baru</option></select></label>
   <label class="field"><span>No. surat jalan</span><input id="in-sj" value="${esc(d.sj_no)}" ${d.noSj?'disabled':''}></label>
   <label class="field"><span>Tanggal surat jalan</span><input id="in-sjdate" type="date" value="${d.sj_date||''}"></label>
  </div>
  ${G.ui.newSup?`<div class="skuin"><label class="field"><span>Nama supplier baru</span><input id="sup-name"></label><button class="btn" data-act="sup-add">Simpan supplier</button></div>`:''}
  <div class="grid"><label class="field"><span>Diinput oleh (otomatis dari akun login)</span><input value="${esc(G.profile.full_name||G.profile.email)}" disabled></label>
   <label class="field"><span>Catatan (opsional)</span><input id="in-note" value="${esc(d.note)}" placeholder="mis. barang diterima fisik oleh Budi, 2 dus penyok"></label></div>
  <label class="chk"><input type="checkbox" id="in-nosj" ${d.noSj?'checked':''}> Tidak ada surat jalan</label>
  ${d.noSj?`<label class="field"><span>Keterangan (wajib)</span><input id="in-nosjnote" value="${esc(d.no_sj_note)}" placeholder="mis. ambil sendiri di pabrik"></label>`:''}
  <div class="field"><span>Foto bukti terima (surat jalan ditandatangani / barang)</span><div class="row">${d.photo?`<img class="thumb" src="${d.photo}" alt="Foto bukti">`:''}<label class="btn" for="in-photo" style="display:inline-flex;align-items:center">${d.photo?'Ganti foto':'Ambil / pilih foto'}</label><input id="in-photo" type="file" accept="image/*" capture="environment" hidden>${d.photo?'<button class="btn ghost" data-act="in-photo-del">Hapus</button>':''}</div></div>
  </section>
  <section class="panel"><h2>2. Barang diterima</h2>
   ${G.ui.np?`<div class="panel" style="background:var(--paper)"><b>Barang baru (belum ada di daftar)</b><p class="small muted">${is('owner')?'Langsung aktif. HPP bisa diisi nanti di menu Produk.':'Akan diajukan ke Owner / Head Operasional / Finance untuk di-ACC. Barangnya tetap bisa langsung dicatat masuk.'}</p>
     <div class="grid"><label class="field"><span>Nama barang</span><input id="np-name" placeholder="mis. Soda Api 1 kg"></label><label class="field"><span>Buat kode SKU</span><input id="np-sku" placeholder="mis. DKM-SODA-1KG" autocapitalize="characters" spellcheck="false"></label>
     <label class="field"><span>Brand</span><select id="np-brand">${G.brands.map(b=>`<option value="${esc(b.code)}">${esc(b.name)}</option>`).join('')}</select></label></div>
     <div class="row"><label class="chk"><input type="checkbox" id="np-ed" checked> Wajib catat ED (personal care)</label></div>
     <div class="row"><button class="btn primary" data-act="np-save">${is('owner')?'Simpan barang':'Ajukan & pakai'}</button><button class="btn ghost" data-act="np-cancel">Batal</button></div></div>`:''}
   <div class="grid">${skuField('in-sku','Produk')}<label class="field"><span>Jumlah (pcs)</span><input id="in-qty" type="number" min="1" inputmode="numeric" value="${esc(G.ui['in-qty']||'')}"></label></div>
   <div class="grid"><label class="field"><span>Tanggal ED ${sel_?(sel_.track_ed?'(wajib untuk produk ini)':'(opsional, isi jika ada)'):'(wajib untuk personal care, isi jika ada)'}</span><input id="in-ed" type="date" value="${esc(G.ui['in-ed']||'')}"></label><label class="field"><span>No. batch (opsional)</span><input id="in-batch" value="${esc(G.ui['in-batch']||'')}"></label></div>
   <div class="row"><button class="btn" data-act="in-add">Tambah ke daftar</button>${G.ui.np?'':'<button class="btn ghost" data-act="np-open">+ Barang baru (belum ada kodenya)</button>'}</div>
   ${d.lines.length?`<div class="tbl"><table><thead><tr><th>Produk</th><th>ED</th><th class="n">Qty</th><th></th></tr></thead><tbody>${d.lines.map((l,i)=>`<tr><td>${esc(prod(l.sku)?.name||l.sku)}<div class="small muted code">${l.sku}${l.batch_no?' · batch '+esc(l.batch_no):''}</div></td><td>${edBadge(l.ed)}</td><td class="n qty">${q(l.qty)}</td><td><button class="btn ghost" data-act="in-del" data-i="${i}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Scan atau ketik SKU tiap barang, isi jumlah (dan ED untuk personal care), lalu Tambah ke daftar.</div>'}
   <div class="row"><button class="btn primary" data-act="in-save" ${d.lines.length?'':'disabled'}>Simpan barang masuk</button>${d.lines.length?'<button class="btn ghost" data-act="in-reset">Kosongkan</button>':''}</div>
  </section>`:''}
  <section class="panel"><h2>Riwayat barang masuk</h2>${list.length?`<div class="tbl"><table><thead><tr><th>Dokumen</th><th>Supplier & surat jalan</th><th>Isi</th>${seeCost()?'<th class="n">Nilai</th>':''}<th>Bukti</th><th>Verifikasi</th></tr></thead><tbody>
   ${list.map(i=>`<tr><td class="code">${i.doc_no}<div class="small muted">${fdate(i.doc_date)} · ${esc(i.received_name||'')}</div><div class="small">${SOURCE[i.source]}</div>${i.note?`<div class="small muted">${esc(i.note)}</div>`:''}</td><td class="small"><b>${esc(i.supplier_name||'–')}</b><div>${i.sj_no?'SJ '+esc(i.sj_no)+(i.sj_date?' · '+fdate(i.sj_date):''):i.no_sj_note?'<span class="badge b-warn">Tanpa SJ</span> '+esc(i.no_sj_note):'–'}</div></td><td class="small pre">${esc(i.items||'')}</td>${seeCost()?`<td class="n">${rp(i.value)}</td>`:''}<td>${i.has_photo?`<button class="btn sm" data-act="in-photo-view" data-id="${i.id}">Lihat foto</button>`:'<span class="badge b-neu">Tanpa foto</span>'}</td><td>${i.verified_at?`<span class="badge b-ok">Cocok</span><div class="small muted">${esc(i.verified_name)}</div>`:is('owner','finance')?`<button class="btn sm" data-act="in-verify" data-id="${i.id}">Tandai cocok</button>`:'<span class="badge b-warn">Belum dicek</span>'}</td></tr>`).join('')}
  </tbody></table></div>${list.length>=page*30?'<button class="btn" data-act="more" data-k="inPage">Tampilkan lebih banyak</button>':''}`:'<div class="empty">Belum ada barang masuk.</div>'}</section>`; };
function inSync(){ const d=G.ui.inD; if(!d||!$('#in-source')||$('#in-source').dataset.gen!==String(d.gen)) return; d.source=$('#in-source').value; d.doc_date=$('#in-date').value; const s=$('#in-sup').value; if(s!=='__new') d.supplier_id=s; d.sj_no=$('#in-sj').value; d.sj_date=$('#in-sjdate').value; if($('#in-nosjnote')) d.no_sj_note=$('#in-nosjnote').value; G.ui['in-qty']=$('#in-qty')?.value||''; if($('#in-ed')) G.ui['in-ed']=$('#in-ed').value; }

/* ---------------- BARANG KELUAR ---------------- */
function newOut(){ return {gen:++GEN,doc_date:today(),purpose:'shopee',ref:'',customer:'',note:'',lines:[]}; }
V.keluar=async()=>{ const canOut=is('owner','staf'); if(canOut&&!G.ui.outD) G.ui.outD=newOut(); const d=G.ui.outD; const page=G.ui.outPage||1;
  const [list,lots]=await Promise.all([sel('v_outbounds',x=>x.order('created_at',{ascending:false}).range(0,page*30-1)), canOut&&d.lines.length?sel('v_lots',x=>x.in('sku',[...new Set(d.lines.flatMap(l=>bund(l.sku)?bund(l.sku).items.map(i=>i.sku):[l.sku]))])):[]]);
  const pend=list.filter(o=>o.status==='pending');
  const plan=(sku,qty)=>{ const allowExp=d.purpose==='rusak'; let ls=lots.filter(l=>l.sku===sku&&(allowExp||l.ed_status!=='kedaluwarsa')).sort((a,b)=>allowExp?((a.ed_status==='kedaluwarsa'?0:1)-(b.ed_status==='kedaluwarsa'?0:1))||String(a.ed||'9').localeCompare(String(b.ed||'9')):String(a.ed||'9').localeCompare(String(b.ed||'9')));
    const t=[]; let left=qty; for(const l of ls){ if(left<=0) break; const n=Math.min(num(l.qty),left); t.push({ed:l.ed,qty:n}); left-=n; } return {t,short:left}; };
  return `<h1>Barang keluar</h1>
  ${canOut?resiPanel():''}
  ${canOut?`<section class="panel"><h2>Input manual</h2><div class="grid">
   <label class="field"><span>Tujuan</span><select id="out-purpose" data-gen="${d.gen}">${Object.entries(PURPOSE).map(([k,v])=>`<option value="${k}" ${d.purpose===k?'selected':''}>${v}</option>`).join('')}</select></label>
   <label class="field"><span>Tanggal</span><input id="out-date" type="date" value="${d.doc_date}"></label>
   <label class="field"><span>No. pesanan / invoice</span><input id="out-ref" value="${esc(d.ref)}"></label>
   <label class="field"><span>Pembeli / penerima</span><input id="out-cust" value="${esc(d.customer)}"></label></div>
   <label class="field"><span>Keterangan${NEED_NOTE.includes(d.purpose)?' (wajib)':''}</span><input id="out-note" value="${esc(d.note)}" placeholder="${d.purpose==='rusak'?'mis. kedaluwarsa Sep 2026, dibuang':''}"></label>
   ${NEED_NOTE.includes(d.purpose)&&is('staf')?'<p class="note">Barang keluar non-penjualan perlu disetujui Owner. Stok baru berkurang setelah disetujui.</p>':''}
   <div class="grid">${skuField('out-sku','Produk')}<label class="field"><span>Jumlah (pcs)</span><input id="out-qty" type="number" min="1" inputmode="numeric" value="${esc(G.ui['out-qty']||'')}"></label></div>
   <div class="row"><button class="btn" data-act="out-add">Tambah ke daftar</button></div>
   ${d.lines.length?`<div class="tbl"><table><thead><tr><th>Produk</th><th>Akan diambil</th><th class="n">Qty</th><th></th></tr></thead><tbody>${d.lines.map((l,i)=>{const b=bund(l.sku); const parts=b?b.items.map(it=>({sku:it.sku,name:it.name,qty:num(it.qty)*l.qty})):[{sku:l.sku,name:prod(l.sku)?.name||l.sku,qty:l.qty}];
     const cell=parts.map(pt=>{const pl=plan(pt.sku,pt.qty); return `${b?`<div><b>${q(pt.qty)} × ${esc(pt.name)}</b></div>`:''}${pl.short>0?`<span class="badge b-bad">stok kurang ${q(pl.short)}</span>`:pl.t.map(x=>`<div>${q(x.qty)} × ${edBadge(x.ed)}</div>`).join('')}`}).join('');
     return `<tr><td>${esc(b?b.name:prod(l.sku)?.name||l.sku)}${b?' <span class="badge b-info">Bundling</span>':''}<div class="small muted code">${l.sku}</div></td><td class="small">${cell}</td><td class="n qty">${q(l.qty)}</td><td><button class="btn ghost" data-act="out-del" data-i="${i}">Hapus</button></td></tr>`}).join('')}</tbody></table></div><p class="small muted">ED terdekat keluar lebih dulu. Barang kedaluwarsa hanya bisa keluar dengan tujuan "Rusak / kedaluwarsa".</p>`:'<div class="empty">Ketik kode SKU, isi jumlah, lalu Tambah ke daftar.</div>'}
   <div class="row"><button class="btn primary" data-act="out-save" ${d.lines.length?'':'disabled'}>Simpan barang keluar</button>${d.lines.length?'<button class="btn ghost" data-act="out-reset">Kosongkan</button>':''}</div></section>`:''}
  ${pend.length&&is('owner')?`<section class="panel hl"><h2>Menunggu persetujuan Anda</h2><div class="tbl"><table><tbody>${pend.map(o=>`<tr><td class="code">${o.doc_no}<div class="small muted">${fdate(o.doc_date)} · ${esc(o.created_name)}</div></td><td><b>${PURPOSE[o.purpose]}</b><div class="small">${esc(o.note||'')}</div></td><td class="small pre">${esc(o.items)}</td><td><div class="row"><button class="btn primary sm" data-act="out-approve" data-id="${o.id}">Setujui</button><button class="btn danger sm" data-act="out-reject" data-id="${o.id}">Tolak</button></div></td></tr>`).join('')}</tbody></table></div></section>`:''}

let pdfLoad=null;
function loadPdfJs(){ if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  return pdfLoad=pdfLoad||new Promise((ok,bad)=>{ const sc=document.createElement('script'); sc.src='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js';
    sc.onload=()=>{ pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'; ok(pdfjsLib); }; sc.onerror=()=>{pdfLoad=null;bad(new Error('Pembaca PDF gagal dimuat. Cek internet.'))}; document.head.appendChild(sc); }); }
async function pdfPages(file){ const lib=await loadPdfJs(); const doc=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer())}).promise; const pages=[];
  for(let i=1;i<=doc.numPages;i++){ const tc=await (await doc.getPage(i)).getTextContent(); const rows={};
    tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const y=Math.round(it.transform[5]/3); (rows[y]=rows[y]||[]).push(it); });
    pages.push(Object.keys(rows).sort((a,b)=>b-a).map(y=>rows[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(it=>it.str.trim()).join(' ')).join('\n')); }
  return pages; }
const normTxt=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
function parseResi(text){
  const T=text, U=T.toUpperCase();
  const platform=/tiktok/i.test(T)?'tiktok':/shopee/i.test(T)?'shopee':/tokopedia/i.test(T)?'tokopedia':/lazada/i.test(T)?'lazada':'';
  const m=T.match(/(?:no\.?\s*pesanan|nomor\s*pesanan|order\s*id|order\s*no\.?|no\.?\s*order|invoice)\s*[:#]?\s*([A-Z0-9][A-Z0-9\/-]{5,})/i);
  const lines=T.split('\n'), items=[];
  const qtyIn=l=>{ const r=l.match(/(?:qty|jumlah|jml|kuantitas)\s*[:x]?\s*(\d{1,4})/i)||l.match(/\bx\s*(\d{1,4})\b/i)||l.match(/\b(\d{1,4})\s*(?:pcs|x)\b/i); return r?+r[1]:0; };
  const hit=new Set();
  G.bundles.filter(b=>b.active).forEach(b=>{ const re=new RegExp('(^|[^A-Z0-9-])'+b.sku.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Z0-9-])'); const li=lines.findIndex(l=>re.test(l.toUpperCase())); if(li<0) return;
    const qn=qtyIn(lines[li])||qtyIn(lines[li+1]||''); items.push({sku:b.sku,qty:qn||1,guess:!qn,bundle:true}); hit.add(li); });
  G.products.filter(p=>p.active).forEach(p=>{ const re=new RegExp('(^|[^A-Z0-9-])'+p.sku.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?![A-Z0-9-])');
    let li=lines.findIndex(l=>re.test(l.toUpperCase()));
    if(li<0){ const nn=normTxt(p.name); if(nn.length>=8){ li=lines.findIndex(l=>normTxt(l).includes(nn)); if(li<0){ li=lines.findIndex((l,i)=>normTxt(l+' '+(lines[i+1]||'')).includes(nn)); if(li>=0&&!normTxt(lines[li]).includes(nn.split(' ')[0])) li++; } } }
    if(li<0||(hit.has(li)&&!re.test(lines[li].toUpperCase()))) return; const qn=qtyIn(lines[li])||qtyIn(lines[li+1]||''); items.push({sku:p.sku,qty:qn||1,guess:!qn}); });
  return {ref:m?m[1]:'',platform,items,text:T}; }
async function readResiFiles(files){ const out=[];
  for(const f of files){ const pages=await pdfPages(f);
    pages.forEach(pg=>{ const r=parseResi(pg); if(!r.ref&&!r.items.length&&!pg.trim()) return;
      const prev=out[out.length-1]; if(prev&&!r.ref&&prev.file===f.name){ r.items.forEach(it=>{ if(!prev.items.some(x=>x.sku===it.sku)) prev.items.push(it); }); prev.text+='\n'+pg; return; }
      out.push({...r,file:f.name}); }); }
  const refs=out.map(r=>r.ref).filter(Boolean);
  const dup=refs.length?await sel('v_outbounds',x=>x.in('ref',refs).neq('status','rejected')):[];
  out.forEach(r=>{ r.dup=dup.some(o=>o.ref===r.ref); if(!r.platform) r.platform=['shopee','tiktok','tokopedia','lazada','website','b2b','offline'].includes(G.ui.outD?.purpose)?G.ui.outD.purpose:'shopee'; });
  return out; }

   <div class="row"><label class="btn tape" for="resi-file">Pilih PDF resi</label><input id="resi-file" type="file" accept="application/pdf,.pdf" multiple hidden>${R.length?'<button class="btn ghost" data-act="resi-clear">Hapus hasil baca</button>':''}</div>
   ${R.length?`<div class="tbl"><table><thead><tr><th>No. pesanan</th><th>Platform</th><th>Barang terbaca</th><th>Status</th></tr></thead><tbody>${R.map((r,i)=>`<tr><td><input data-rref="${i}" value="${esc(r.ref)}" placeholder="isi no. pesanan" style="min-height:38px;border:1px solid var(--line-strong);background:var(--surface);border-radius:4px;padding:4px 8px;width:100%;min-width:150px"><div class="small muted">${esc(r.file)}</div></td>
     <td><select data-rplat="${i}" style="min-height:38px">${['shopee','tiktok','tokopedia','lazada','website','b2b','offline'].map(k=>`<option value="${k}" ${r.platform===k?'selected':''}>${PURPOSE[k]}</option>`).join('')}</select></td>

     <td>${r.saved?`<span class="badge b-ok">Tersimpan ${esc(r.saved)}</span>`:r.dup?'<span class="badge b-warn">Sudah pernah diinput</span>':r.items.length?'<span class="badge b-info">Siap</span>':'<span class="badge b-bad">Tidak bisa</span>'}</td></tr>`).join('')}</tbody></table></div>

const EXPORTS={
 keluar:{label:'Barang keluar (per ED)',view:'v_outbound_lines',date:'tanggal',order:['tanggal','doc_no','sku','ed'],status:true},
 masuk:{label:'Barang masuk',view:'v_inbound_lines',date:'tanggal',order:['tanggal','doc_no','sku','ed','batch','qty']},
 kartu:{label:'Kartu stok (semua pergerakan)',view:'v_moves',date:'tanggal',order:['at','id'],cols:['waktu','kind','doc_no','sku','name','brand_code','ed','qty','cost','value','note','by_name']},
 stok:{label:'Stok saat ini per ED',view:'v_lots',order:['sku','ed'],cols:['sku','name','brand_code','ed','qty','days_left','ed_status','cost','value']},
 so:{label:'Hasil stock opname',view:'v_opname_lines',order:['doc_no','sku'],cols:['doc_no','period','so_status','sku','name','brand_code','counted','system_qty','diff','diff_value','reason','counted_name']},
};
V.export=async()=>{ const k=G.ui.exk||'keluar', e=EXPORTS[k]; const from=G.ui.exFrom||today().slice(0,8)+'01', to=G.ui.exTo||today();
  return `<h1>Export Excel</h1><p class="muted">Data asli dari database, untuk pembukuan (mis. diimpor ke Accurate). Setiap file berisi lembar <b>Data</b> dan lembar <b>Ringkasan</b> (jumlah baris & total kontrol) untuk dicocokkan.</p>
  <section class="panel"><div class="grid"><label class="field"><span>Data</span><select id="ex-k">${Object.entries(EXPORTS).map(([id,x])=>`<option value="${id}" ${id===k?'selected':''}>${x.label}</option>`).join('')}</select></label>
  ${e.date?`<label class="field"><span>Dari tanggal</span><input id="ex-from" type="date" value="${from}"></label><label class="field"><span>Sampai tanggal</span><input id="ex-to" type="date" value="${to}"></label>`:''}</div>
  ${e.status?'<label class="chk"><input type="checkbox" id="ex-posted" checked> Hanya yang sudah keluar (tanpa yang menunggu/ditolak)</label>':''}
  <div class="row"><button class="btn primary" data-act="ex-xlsx">Unduh Excel (.xlsx)</button><button class="btn" data-act="ex-csv">Unduh CSV</button></div><p class="small muted" id="ex-prog"></p></section>`; };
async function doExport(kind){ const k=G.ui.exk||'keluar', e=EXPORTS[k]; const from=$('#ex-from')?.value, to=$('#ex-to')?.value; const posted=$('#ex-posted')?.checked;
  const rows=await fetchAll(e.view,x=>{ if(e.date&&from) x=x.gte(e.date,from); if(e.date&&to) x=x.lte(e.date,to); if(posted) x=x.eq('status','posted'); return x; },e.order,(n,t)=>{const p=$('#ex-prog'); if(p) p.textContent=`Mengunduh ${n} dari ${t} baris…`;});
  if(!rows.length) throw new Error('Tidak ada data di periode ini');
  const data=rows.map(r=>{ const o={}; (e.cols||Object.keys(r)).forEach(c=>{ if(!seeCost()&&/^(cost|value|hpp|nilai|nilai_hpp|diff_value)$/.test(c)) return; o[c]=r[c]; }); return o; });
  const cols=Object.keys(data[0]); const sums=cols.filter(c=>/^(qty|nilai|nilai_hpp|value|diff|diff_value|counted|system_qty)$/.test(c)).map(c=>[c,data.reduce((a,r)=>a+num(r[c]),0)]);
  const name=`4keledai_${k}_${e.date?(from+'_sd_'+to):today()}`;
  if(kind==='csv'){ const csv=[cols.join(','),...data.map(r=>cols.map(c=>{const v=r[c];return v==null?'':typeof v==='number'?v:'"'+String(v).replace(/"/g,'""')+'"'}).join(','))].join('\r\n'); download(new Blob(['﻿'+csv],{type:'text/csv;charset=utf-8'}),name+'.csv'); }
  else{ if(!window.XLSX) throw new Error('Modul Excel belum termuat. Cek internet atau pakai CSV.');
    const wb=XLSX.utils.book_new(); const ws=XLSX.utils.json_to_sheet(data.map(r=>{const o={...r}; cols.forEach(c=>{ if(o[c]!=null&&/^(qty|nilai|nilai_hpp|value|hpp|cost|harga_jual|diff|diff_value|counted|system_qty|days_left)$/.test(c)) o[c]=num(o[c]); }); return o;}),{header:cols});
    XLSX.utils.book_append_sheet(wb,ws,'Data');
    const sum=[['Laporan',e.label],['Periode',e.date?`${from} s/d ${to}`:'Per '+today()],['Diunduh oleh',G.profile.full_name||G.profile.email],['Waktu unduh',new Date().toLocaleString('id-ID')],['Jumlah baris',data.length],...sums.map(([c,v])=>['Total '+c,v])];
    XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sum),'Ringkasan');
    XLSX.writeFile(wb,name+'.xlsx'); }
  const p=$('#ex-prog'); if(p) p.textContent=`Selesai: ${data.length} baris${sums.length?' · '+sums.map(([c,v])=>`total ${c} ${q(v)}`).join(' · '):''}`;
  banner('ok','FILE DIUNDUH',`${data.length} baris`); }
function download(blob,name){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500); }

function pendingSection(){ const P=G.products.filter(p=>p.approved===false); if(!P.length) return '';
  const can=is('owner','finance');

function tpl(name,rows){ if(!window.XLSX) return banner('bad','MODUL EXCEL BELUM TERMUAT','Cek internet'); const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),'Isi di sini'); XLSX.writeFile(wb,name); }
async function readSheet(file){ if(!window.XLSX) throw new Error('Modul Excel belum termuat'); const buf=await file.arrayBuffer(); const wb=XLSX.read(buf,{type:'array',cellDates:true}); const ws=wb.Sheets[wb.SheetNames[0]];
  return XLSX.utils.sheet_to_json(ws,{defval:'',raw:true}).map(r=>{const o={}; Object.entries(r).forEach(([k,v])=>o[String(k).trim().toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')]=v); return o;}).filter(r=>Object.values(r).some(v=>String(v).trim()!=='')); }
const yes=v=>/^(1|y|ya|yes|true|wajib)$/i.test(String(v).trim());
function toDate(v){ if(!v) return null; if(v instanceof Date) return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  const s=String(v).trim(); let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if(/^\d{5}$/.test(s)){ const d=new Date(Date.UTC(1899,11,30)+(+s)*864e5); return d.toISOString().slice(0,10); } return 'INVALID:'+s; }

A['u-copy']=async d=>{ try{ await navigator.clipboard.writeText(d.t); banner('ok','DISALIN','Tempel di chat pribadi ke orangnya'); }catch(e){ banner('bad','GAGAL MENYALIN',''); } };
A['u-reset']=(d,e,btn)=>busy(btn,async()=>{ const v=(document.querySelector(`[data-upass="${d.id}"]`)?.value||'').trim(); if(v.length<8) throw new Error('Password baru minimal 8 karakter'); await rpc('reset_password',{p_id:d.id,p_pass:v}); G.ui.showPw=true; banner('ok','PASSWORD DIRESET','Password baru tampil di tabel'); renderView(); });
A['u-save']=(d,e,btn)=>busy(btn,async()=>{ await rpc('update_user',{p_id:d.id,p_role:document.querySelector(`[data-urole="${d.id}"]`).value,p_active:document.querySelector(`[data-uactive="${d.id}"]`).checked,p_name:document.querySelector(`[data-uname="${d.id}"]`).value}); banner('ok','PENGGUNA DISIMPAN',''); renderView(); });
A['me-id']=(d,e,btn)=>busy(btn,async()=>{ const v=$('#me-id').value.trim(); if(!v) throw new Error('ID tidak boleh kosong'); const r=await rpc('change_login_id',{p_id:G.profile.id,p_new:v});
  try{ await sb.auth.refreshSession(); }catch(e){} G.profile=await rpc('my_profile'); banner('ok','ID DIGANTI','Masuk berikutnya pakai ID: '+r); render(); });
A['u-id']=(d,e,btn)=>busy(btn,async()=>{ const v=(document.querySelector(`[data-uid="${d.id}"]`)?.value||'').trim(); if(!v) throw new Error('Isi ID baru'); const r=await rpc('change_login_id',{p_id:d.id,p_new:v}); banner('ok','ID DIGANTI','ID baru: '+r); renderView(); });
A['me-name']=(d,e,btn)=>busy(btn,async()=>{ const n=$('#me-name').value.trim(); if(!n) throw new Error('Nama tidak boleh kosong'); await rpc('update_my_name',{p_name:n}); G.profile=await rpc('my_profile'); banner('ok','NAMA DISIMPAN',n); render(); });
A['s-save']=(d,e,btn)=>busy(btn,async()=>{ await rpc('save_settings',{p_company:$('#s-company').value,p_warn:Math.max(1,Math.min(24,num($('#s-warn').value)||6))}); await loadMaster(); banner('ok','PENGATURAN DISIMPAN',''); render(); });

/* ---------------- EVENT ---------------- */
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const a=A[el.dataset.act]; if(!a) return;
  if(el.tagName==='BUTTON'||el.tagName==='A') e.preventDefault(); try{ const r=a(el.dataset,e,el.tagName==='BUTTON'?el:null); if(r&&r.catch) r.catch(err=>banner('bad','GAGAL',errMsg(err))); }catch(err){ banner('bad','GAGAL',errMsg(err)); } });
document.addEventListener('submit',async e=>{ e.preventDefault(); const f=e.target;
  if(f.id==='sc-form'){ const v=$('#sc-in').value; $('#sc-in').value=''; return handleCode(v); }
  if(f.id==='pwform'){ const btn=f.querySelector('button:not(.eye)'); const a=$('#me-pass1').value, b=$('#me-pass2').value;
    await busy(btn,async()=>{ if(a.length<8) throw new Error('Password minimal 8 karakter'); if(a!==b) throw new Error('Kedua password tidak sama'); const {error}=await sb.auth.updateUser({password:a}); if(error) throw error; try{ await rpc('mark_password_changed'); }catch(e){} f.reset(); banner('ok','PASSWORD DIGANTI','Pakai password baru saat masuk berikutnya'); }); return; }
  if(f.id==='newuser'){ const btn=f.querySelector('button:not(.eye)'); const id=$('#nu-id').value.trim().toLowerCase(), name=$('#nu-name').value.trim(), r=$('#nu-role').value, pass=$('#nu-pass').value;
    await busy(btn,async()=>{ if(!/^[a-z0-9._-]{3,30}$/.test(id)) throw new Error('ID 3–30 huruf/angka, tanpa spasi');
      const tmp=supabase.createClient(G.cfg.url,G.cfg.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false,storageKey:'k4_tmp_'+Date.now()}});
      const {data,error}=await tmp.auth.signUp({email:toEmail(id),password:pass,options:{data:{full_name:name}}});
      if(error) throw new Error(/invalid/i.test(error.message)?'Supabase menolak ID ini. Buat lewat Supabase → Authentication → Users → Add user (centang Auto Confirm), lalu aktifkan di sini.':errMsg(error));
      if(!data.user||(data.user.identities&&data.user.identities.length===0)) throw new Error('ID ini sudah dipakai. Pilih ID lain.');
      if(!data.session) banner('info','CATATAN','Matikan "Confirm email" di Supabase → Authentication → Sign In / Providers → Email, supaya akun bisa langsung masuk.');
      await rpc('update_user',{p_id:data.user.id,p_role:r,p_active:true,p_name:name});
      await rpc('save_credential',{p_id:data.user.id,p_login:id,p_pass:pass});
      try{ await tmp.auth.signOut(); }catch(e){}
      f.reset(); banner('ok','AKUN DIBUAT',`ID: ${id} · ${ROLE_LABEL[r]}`); renderView(); }); return; }
  if(f.id==='authform'){ const btn=f.querySelector('button:not(.eye)'); const email=G.ui.authTab==='daftar'?$('#au-email').value.trim():toEmail($('#au-email').value), pass=$('#au-pass').value;
    await busy(btn,async()=>{ if(G.ui.authTab==='daftar'){ const {data,error}=await sb.auth.signUp({email,password:pass,options:{data:{full_name:$('#au-name').value.trim()},emailRedirectTo:location.origin+location.pathname}}); if(error) throw error; if(!data.session) banner('info','CEK EMAIL ANDA','Klik link konfirmasi dari Supabase, lalu masuk'); }
      else { const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error) throw error; } }); } });
document.addEventListener('change',async e=>{ const t=e.target, id=t.id; liveSync(t);
  if(id==='in-sup'){ if(t.value==='__new'){ inSync(); G.ui.newSup=true; renderView(); } else { G.ui.newSup=false; inSync(); } }
  if(id==='in-nosj'){ inSync(); G.ui.inD.noSj=t.checked; renderView(); }
  if(id==='in-source'){ inSync(); renderView(); }
  if(['in-sku','out-sku','bd-sku'].includes(id)&&t.value.trim()&&!/\s—\s/.test(t.value)){ const it=id==='out-sku'?readItem(id):readSku(id); if(it){ t.value=it.sku+' — '+it.name; G.ui[id]=t.value; } }
  if(id==='in-sku'){ inSync(); G.ui['in-sku']=t.value; renderView(); }
  if(id==='out-purpose'){ outSync(); renderView(); }
  if(t.dataset.photo&&t.files.length){ const sku=t.dataset.photo, f=t.files[0]; t.value='';
    try{ banner('info','MENGUNGGAH FOTO…',sku); const data=await shrink(f,320,'image/jpeg',.8); await rpc('set_product_photo',{p_sku:sku,p_photo:data}); G.photos[sku]=data; banner('ok','FOTO DISIMPAN',prod(sku)?.name||sku); }
    catch(err){ banner('bad','FOTO GAGAL',errMsg(err)); } renderView(); }
  if(id==='resi-file'&&t.files.length){ const files=[...t.files]; t.value=''; banner('info','MEMBACA PDF…',files.length+' file');
    try{ G.ui.resi=[...(G.ui.resi||[]),...await readResiFiles(files)]; const R=G.ui.resi; banner(R.some(r=>r.items.length)?'ok':'bad',`${R.length} RESI TERBACA`,R.filter(r=>!r.items.length).length?'Ada resi yang produknya tidak dikenali, cek tabel':'Cek jumlahnya, lalu simpan'); }
    catch(err){ banner('bad','PDF TIDAK TERBACA',errMsg(err)); } renderView(); }
  if(t.dataset.rref) G.ui.resi[+t.dataset.rref].ref=t.value.trim();
  if(t.dataset.rplat) G.ui.resi[+t.dataset.rplat].platform=t.value;
  if(t.dataset.rqty){ const [i,j]=t.dataset.rqty.split(':').map(Number); const it=G.ui.resi[i].items[j]; it.qty=Math.max(0,num(t.value)); it.guess=false; }
  if(id==='in-photo'&&t.files[0]){ try{ inSync(); G.ui.inD.photo=await shrink(t.files[0],1000,'image/jpeg',.6); renderView(); banner('ok','FOTO DILAMPIRKAN',''); }catch(err){ banner('bad','FOTO GAGAL',errMsg(err)); } }
  if(id==='sc-photo'&&t.files[0]) decodePhoto(t.files[0]);
  if(id==='stok-brand'){ G.ui.sb=t.value; renderView(); }
  if(id==='k-from'||id==='k-to'||id==='k-sku'){ G.ui.kFrom=$('#k-from').value; G.ui.kTo=$('#k-to').value; G.ui.kSku=$('#k-sku').value; G.ui.kPage=1; renderView(); }
  if(id==='ex-k'){ G.ui.exk=t.value; renderView(); }
  if(id==='ex-from'||id==='ex-to'){ G.ui.exFrom=$('#ex-from').value; G.ui.exTo=$('#ex-to').value; }
  if(t.dataset?.label!==undefined) labelSync();
  if(id==='imp-produk'&&t.files[0]){ const f=t.files[0]; t.value=''; await busy(null,async()=>{ const rows=await readSheet(f);
    const data=rows.map(r=>({sku:String(r.sku||r.kode_sku||'').trim(),name:String(r.nama||r.nama_produk||r.name||'').trim(),brand_code:String(r.brand_kode||r.brand||'').trim(),track_ed:yes(r.wajib_ed),min_stock:num(r.stok_minimum),cost:num(r.hpp),price:num(r.harga_jual),barcode:String(r.barcode||'').trim()}));
    const res=await rpc('import_products',{p_rows:data}); await loadMaster(); banner('ok','PRODUK DIIMPOR',`${res.baru} baru, ${res.diperbarui} diperbarui`); renderView(); }); }
  if(id==='imp-saldo'&&t.files[0]){ const f=t.files[0]; t.value=''; await busy(null,async()=>{ const rows=await readSheet(f);
    const lines=rows.map((r,i)=>{ const sku=String(r.sku||'').trim().toUpperCase(); const ed=toDate(r.ed); if(ed&&ed.startsWith('INVALID')) throw new Error(`Baris ${i+2}: tanggal ED "${ed.slice(8)}" tidak dikenali (pakai format 2027-12-31)`); if(!prod(sku)) throw new Error(`Baris ${i+2}: SKU ${sku||'(kosong)'} belum terdaftar`); return {sku,ed,qty:num(r.qty||r.jumlah)}; });
    const no=await rpc('create_inbound',{p:{source:'saldo_awal',note:'Impor stok awal dari '+f.name,lines}}); banner('ok','STOK AWAL MASUK',`${no} · ${lines.length} baris`); }); }
});
/* Setiap ketikan langsung dicatat ke draf formulir, jadi tidak ada isian yang hilang saat tampilan diperbarui */
const IN_MAP={'in-note':'note','in-source':'source','in-date':'doc_date','in-sj':'sj_no','in-sjdate':'sj_date','in-nosjnote':'no_sj_note'};
const OUT_MAP={'out-purpose':'purpose','out-date':'doc_date','out-ref':'ref','out-cust':'customer','out-note':'note'};
function liveSync(t){ const id=t.id; if(!id) return;
  if(IN_MAP[id]&&G.ui.inD) G.ui.inD[IN_MAP[id]]=t.value;
  if(id==='in-sup'&&G.ui.inD&&t.value!=='__new') G.ui.inD.supplier_id=t.value;
  if(OUT_MAP[id]&&G.ui.outD) G.ui.outD[OUT_MAP[id]]=t.value;
  if(id==='in-qty'||id==='in-ed'||id==='in-batch'||id==='out-qty') G.ui[id]=t.value; }
document.addEventListener('input',e=>{ const t=e.target; liveSync(t);
  if(t.id==='home-q'){ const w=t.value.toLowerCase().trim().split(/\s+/).filter(Boolean); document.querySelectorAll('tr[data-f],.pcard[data-f]').forEach(r=>{ r.hidden=!w.every(x=>r.dataset.f.includes(x)); }); }
  if(t.id==='stok-q'){ G.ui.sq=t.value; clearTimeout(G.ui.sqT); G.ui.sqT=setTimeout(()=>renderView().then(()=>{const i=$('#stok-q'); if(i){i.focus(); i.setSelectionRange(i.value.length,i.value.length);}}),350); }
  if(t.dataset&&t.dataset.so!==undefined) soQueue(t.dataset.so,t.value);
  if(t.id==='so-filter'){ G.ui.soF=t.value; clearTimeout(G.ui.sfT); G.ui.sfT=setTimeout(async()=>{ clearTimeout(soTimer); await soFlush(); await renderView(); const i=$('#so-filter'); if(i){i.focus(); i.setSelectionRange(i.value.length,i.value.length);} },350); }
});
window.addEventListener('beforeunload',()=>{ if(Object.keys(soPending).length) soFlush(); });
boot().catch(e=>renderFatal(errMsg(e))).finally(hideBoot);
</script>
