<style>
/* Layout: lantai gudang — header biru tinta, menu kiri (desktop) / tab atas (HP), satu aksi kuning "Scan" */
:root{
  --paper:#F2F5F7; --surface:#FFFFFF; --ink:#16324F; --ink-2:#4A6177; --line:#D5DEE6;
  --tape:#F5C33B; --tape-ink:#2B2100; --ok:#1F7A4D; --ok-bg:#E3F3EA; --bad:#B83227; --bad-bg:#FBE7E4;
  --warn:#9A6400; --warn-bg:#FDF1D8; --info:#1E5C96; --info-bg:#E2EEF9; --head:#16324F; --head-ink:#FFFFFF;
  --f:"Archivo", "Helvetica Neue", Arial, sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0E1822; --surface:#15222F; --ink:#E4ECF3; --ink-2:#9FB2C3; --line:#2A3B4C;
  --tape:#F5C33B; --tape-ink:#2B2100; --ok:#5CC48E; --ok-bg:#12301F; --bad:#F07F72; --bad-bg:#3A1714;
  --warn:#F0B85A; --warn-bg:#33260C; --info:#7DB6EA; --info-bg:#142B42; --head:#0A2238; --head-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1822; --surface:#15222F; --ink:#E4ECF3; --ink-2:#9FB2C3; --line:#2A3B4C;
  --tape:#F5C33B; --tape-ink:#2B2100; --ok:#5CC48E; --ok-bg:#12301F; --bad:#F07F72; --bad-bg:#3A1714;
  --warn:#F0B85A; --warn-bg:#33260C; --info:#7DB6EA; --info-bg:#142B42; --head:#0A2238; --head-ink:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.5;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--tape);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:1.35rem;font-weight:750;font-stretch:85%}
h3{font-size:1.05rem;font-weight:700}
p{margin:0}
.gutter{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);border-bottom:4px solid var(--tape)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px}
.brandmark{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:34px;height:34px;border-radius:7px;background:var(--tape);color:var(--tape-ink);display:grid;place-items:center;font-weight:800;font-size:.9rem;flex:none}
.brandmark b{font-weight:800;font-stretch:80%;font-size:1.1rem;letter-spacing:.01em;display:block;line-height:1.1}
.brandmark small{opacity:.75;font-size:.75rem}
.top label{font-size:.72rem;opacity:.8;display:block}
.top select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:7px;padding:5px 8px;min-width:0}
.top select option{color:#111;background:#fff}
.demo-pill{background:var(--tape);color:var(--tape-ink);font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px}

/* Shell */
.shell{display:grid;grid-template-columns:1fr;gap:0;max-width:1240px;margin:0 auto}
nav.menu{display:flex;gap:6px;overflow-x:auto;padding-block:10px;border-bottom:1px solid var(--line);background:var(--surface)}
nav.menu button{flex:none;border:1px solid var(--line);background:transparent;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600;color:var(--ink-2);white-space:nowrap}
nav.menu button[aria-current="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
nav.menu .grp{display:none}
main{padding-block:18px 120px;min-width:0;display:grid;gap:18px;align-content:start}
@media (min-width:900px){
  .shell{grid-template-columns:230px minmax(0,1fr)}
  nav.menu{flex-direction:column;overflow:visible;border-bottom:0;border-right:1px solid var(--line);min-height:calc(100vh - 70px);padding:18px 12px;position:sticky;top:70px;align-self:start;background:transparent}
  nav.menu button{text-align:left;border:0;padding:8px 12px}
  nav.menu .grp{display:block;font-size:.72rem;color:var(--ink-2);letter-spacing:.06em;text-transform:uppercase;padding:12px 12px 2px}
  main{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}
}

/* Elements */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row.between{justify-content:space-between}
.muted{color:var(--ink-2)}
.small{font-size:.82rem}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:650;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.tape{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);font-weight:800}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;text-decoration:underline;padding-inline:4px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:.78rem;color:var(--ink-2);font-weight:600}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:9px 10px;min-height:42px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.badge{display:inline-block;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:99px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)}.b-bad{background:var(--bad-bg);color:var(--bad)}
.b-warn{background:var(--warn-bg);color:var(--warn)}.b-info{background:var(--info-bg);color:var(--info)}
.b-neu{background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-weight:650;color:var(--ink-2);background:var(--paper);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right}
.qty{font-weight:800;font-size:1.05rem}
.code{font-weight:700;font-stretch:80%;letter-spacing:.02em}
.empty{padding:22px;text-align:center;color:var(--ink-2);border:1px dashed var(--line);border-radius:10px}

/* Tiles gudang */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;cursor:pointer;display:grid;gap:4px;min-height:96px}
.tile:hover{border-color:var(--ink)}
.tile b{font-size:1.05rem}
.tile small{color:var(--ink-2)}
.tile .count{justify-self:start}

/* Alur langkah */
.steps{display:grid;gap:8px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--tape);color:var(--tape-ink);display:grid;place-items:center;font-weight:800;font-size:.85rem}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flow span{padding:4px 10px;border-radius:99px;border:1px solid var(--line);font-size:.8rem;font-weight:650;color:var(--ink-2)}
.flow span.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.flow span.done{background:var(--ok-bg);color:var(--ok);border-color:transparent}

/* Stat */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:1.5rem;font-weight:800;font-stretch:85%}
.stat span{color:var(--ink-2);font-size:.82rem}

/* Scan */
.scanfab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;box-shadow:0 6px 18px rgba(0,0,0,.25);font-size:1.05rem;padding:14px 22px;border-radius:99px}
.sheet-bg{position:fixed;inset:0;background:rgba(5,15,25,.55);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:12px;max-height:88vh;overflow:auto}
.viewfinder{height:120px;border-radius:12px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 7px);opacity:.18;position:relative}
.vf-wrap{position:relative}
.vf-wrap p{position:absolute;inset:0;display:grid;place-items:center;text-align:center;font-weight:650;font-size:.85rem;padding:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px dashed var(--ink-2);background:var(--paper);border-radius:8px;padding:6px 9px;cursor:pointer;font-size:.8rem;text-align:left}
.chip b{display:block;font-stretch:80%}
.chip.loc{border-style:solid;border-color:var(--tape)}

/* Banner hasil scan: elemen yang paling penting untuk staf */
.banner{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:50;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));color:#fff;display:grid;gap:2px;text-align:center}
.banner b{font-size:1.6rem;font-weight:800;font-stretch:80%;letter-spacing:.01em}
.banner.ok{background:#1F7A4D}.banner.bad{background:#B83227}.banner.info{background:#1E5C96}
@media (prefers-reduced-motion:no-preference){.banner{animation:drop .18s ease-out}}
@keyframes drop{from{transform:translateY(-12px);opacity:.4}to{transform:none;opacity:1}}
.progress{height:8px;border-radius:99px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ok)}
tr.done td{background:var(--ok-bg)}
.note{border-left:4px solid var(--tape);padding:8px 12px;background:var(--paper);border-radius:0;font-size:.88rem}

.stat b{white-space:nowrap;font-size:clamp(1.1rem,4.6vw,1.5rem)}
.menu-foot{margin-top:auto;padding:12px;display:none}

.pipe{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.pipe .step{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);text-align:left;cursor:pointer}
.pipe .step b{display:block;font-size:1.6rem;font-weight:800;font-stretch:85%}
.pipe .step span{font-size:.8rem;color:var(--ink-2)}
.pipe .step.hot{border-color:var(--tape);box-shadow:inset 4px 0 0 var(--tape)}

.skuin .field{flex:1}
.skuin .btn{flex:none}
.scanbtn{background:var(--tape);color:var(--tape-ink);border-color:var(--tape);font-weight:800}
.cam{position:relative;border-radius:12px;overflow:hidden;background:#06121d;aspect-ratio:4/3;max-width:100%}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam .aim{position:absolute;inset:18% 12%;border:3px solid var(--tape);border-radius:10px;pointer-events:none}
.cam .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;padding:16px;font-weight:600;font-size:.9rem}
.thumb{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.photo-drop{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.labels{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.label{border:1px dashed var(--ink-2);border-radius:8px;padding:10px;display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;background:#fff;color:#111}
.label .qr{width:84px;height:84px}
.label .qr img,.label .qr canvas{width:84px!important;height:84px!important}
.label b{font-size:1.05rem;font-stretch:80%;letter-spacing:.02em;display:block;word-break:break-all}
.label small{font-size:.72rem;line-height:1.25;display:block}
.pill-nav{display:flex;gap:6px;flex-wrap:wrap}
.pill-nav button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;cursor:pointer;font-weight:600}
.pill-nav button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chk{display:flex;gap:8px;align-items:center;font-size:.88rem}
.chk input{width:20px;height:20px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:.88rem}
.kv dt{color:var(--ink-2)}.kv dd{margin:0}
@media print{
  body *{visibility:hidden}
  #print-area,#print-area *{visibility:visible}
  #print-area{position:absolute;inset:0;padding:8mm}
  .label{break-inside:avoid;border-color:#999}
}

/* ================= PESANAN (Sales) ================= */
function expandLine(ext,qty){ const m=S.mapping[ext]; if(m) return m.map(([sku,k])=>({sku,qty:qty*k})); const p=prod(ext); return p?[{sku:p.sku,qty}]:null; }
function rebuildItems(o){ const agg={}; let ok=true; o.lines.forEach(l=>{ const e=expandLine(l.ext,l.qty); if(!e){ok=false;return} e.forEach(x=>agg[x.sku]=(agg[x.sku]||0)+x.qty); });
  o.items=Object.entries(agg).map(([sku,qty])=>({sku,qty})); if(o.status==='perlu_peta'&&ok) o.status='baru'; if(o.status==='baru'&&!ok) o.status='perlu_peta'; }

  const list=S.orders.filter(o=>tab==='aktif'?['baru','perlu_peta'].includes(o.status):tab==='kirim'?o.status==='dikirim':o.status==='batal').sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return `<div class="row between"><h2>Pesanan</h2><button class="btn primary" data-act="new-so">Buat pesanan B2B / jual langsung</button></div>
  ${S.ui.soForm?soForm():''}
  <section class="panel"><h3>Impor pesanan marketplace</h3>
   <div class="pill-nav">${Object.keys(MP_FILES).map(k=>`<button data-act="mpch" data-c="${k}" aria-pressed="${k===ch}">${CHANNEL[k]} · ${MP_FILES[k].store}</button>`).join('')}</div>
   <p class="muted small">Unduh file pesanan dari Seller Center lalu upload. Pesanan yang sudah pernah diimpor otomatis dilewati, jadi tidak ada yang dobel.</p>
   <div class="tbl-wrap"><table><thead><tr>${f.head.map((h,i)=>`<th class="${i>=5?'n':''}">${h}</th>`).join('')}</tr></thead><tbody>${f.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${i>=5?'n':''} ${i===0||i===3?'code':''}">${i===6?q(c):esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
   <div class="row"><button class="btn primary" data-act="mp-import">Impor ${f.file}</button><span class="muted small">Di aplikasi asli: tombol pilih file .xlsx/.csv dari HP/laptop.</span></div>
   ${S.ui.lastImport?`<div class="note">${esc(S.ui.lastImport)}</div>`:''}
  </section>
  ${unm.length?`<section class="panel" style="border:2px solid var(--bad)"><h3>SKU marketplace belum dikenal</h3><p class="muted small">Petakan sekali, berikutnya otomatis. Satu SKU paket bisa jadi beberapa produk.</p>
   <div class="tbl-wrap"><table><tbody>${unm.map(s=>`<tr><td class="code">${esc(s)}${s==='CHEM-H2SO4-5KG'?'<div class="muted small">Di Master HPP: bundling 5 KG</div>':''}</td><td><div class="row"><select id="map-${esc(s)}" aria-label="Produk">${S.products.map(p=>`<option value="${p.sku}" ${p.sku==='CHEM-H2SO4-1KG'?'selected':''}>${esc(p.name)}</option>`).join('')}</select><label class="row small">× <input id="mk-${esc(s)}" type="number" min="1" value="${s.includes('5KG')?5:1}" style="width:64px" aria-label="Kali"></label><button class="btn" data-act="map-save" data-s="${esc(s)}">Simpan</button></div></td></tr>`).join('')}</tbody></table></div></section>`:''}
  <section class="panel"><div class="row between"><h3>Daftar pesanan</h3><div class="pill-nav">${[['aktif','Aktif'],['kirim','Sudah dikirim'],['batal','Batal']].map(([k,l])=>`<button data-act="ptab" data-c="${k}" aria-pressed="${tab===k}">${l}</button>`).join('')}</div></div>
   ${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Pesanan</th><th>Kanal</th><th>Pembeli</th><th>Barang</th><th class="n">Nilai</th><th>Status</th></tr></thead><tbody>
   ${list.map(o=>`<tr><td class="code">${esc(o.no)}<div class="muted small">${esc(o.ref)}</div></td><td class="small">${CHANNEL[o.channel]}</td><td class="small">${esc(o.channel==='b2b'?custName(o.customer):o.customer)}</td><td class="small">${o.lines.map(l=>`${esc(l.ext)} × ${q(l.qty)}`).join('<br>')}</td><td class="n">${rp(orderTotal(o))}</td><td>${stBadge(o.status)}${o.resi?`<div class="muted small">Resi ${esc(o.resi)}</div>`:''}${o.status==='baru'?`<div><button class="btn ghost small" data-act="o-cancel" data-no="${esc(o.no)}">Batalkan</button></div>`:''}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada pesanan di tab ini.</div>'}
  </section>`; };
function soForm(){ const d=S.ui.so; const isB2B=d.channel==='b2b';

/* ================= KEMAS & KIRIM (Staf) ================= */
V.kemas=()=>{ const o=S.orders.find(x=>x.no===S.ui.packNo&&x.status==='baru'); if(o) return packView(o);
  const list=S.orders.filter(x=>x.status==='baru');
  return `<h2>Kemas & kirim</h2><p class="muted">Pesanan dari sales dan marketplace muncul di sini. Pilih satu, scan barangnya, lalu kirim.</p>
  <section class="panel">${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Pesanan</th><th>Kanal</th><th>Untuk</th><th>Isi</th><th></th></tr></thead><tbody>${list.map(o=>`<tr><td class="code">${esc(o.no)}<div class="muted small">${esc(o.ref)}</div></td><td class="small">${CHANNEL[o.channel]}</td><td class="small">${esc(o.channel==='b2b'?custName(o.customer):o.customer)}</td><td class="small">${o.items.map(i=>`${q(i.qty)} × ${esc(prodName(i.sku))}`).join('<br>')}</td><td class="n"><button class="btn primary" data-act="pack-open" data-no="${esc(o.no)}">Kemas</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Tidak ada pesanan yang perlu dikemas.</div>'}</section>`; };
function packView(o){ const tot=o.items.reduce((a,i)=>a+i.qty,0), got=o.items.reduce((a,i)=>a+(o.packed[i.sku]||0),0);
  return `<button class="btn ghost" data-act="go" data-v="kemas" style="justify-self:start">← Semua pesanan</button>
  <div class="row between"><h2>Kemas ${esc(o.no)}</h2><span class="badge b-info">${CHANNEL[o.channel]}</span></div>
  <dl class="kv"><dt>Untuk</dt><dd>${esc(o.channel==='b2b'?custName(o.customer):o.customer)}</dd><dt>Referensi</dt><dd class="code">${esc(o.ref)}</dd></dl>
  <section class="panel"><div class="row between"><b>${q(got)} dari ${q(tot)} barang ter-scan</b><button class="btn scanbtn" data-act="pack-scan">Scan barang</button></div>
   <div class="progress"><i style="width:${tot?got/tot*100:0}%"></i></div>
   <div class="tbl-wrap"><table><thead><tr><th>Produk</th><th>Ambil yang</th><th class="n">Perlu</th><th class="n">Ter-scan</th></tr></thead><tbody>
   ${o.items.map(i=>{const pl=planOut(i.sku,i.qty,false);const done=(o.packed[i.sku]||0)>=i.qty;return `<tr class="${done?'done':''}"><td><b>${esc(prodName(i.sku))}</b><div class="muted small code">${i.sku}</div></td><td class="small">${pl.short>0?`<span class="badge b-bad">stok kurang ${q(pl.short)}</span>`:pl.take.map(t=>`<div>${q(t.qty)} × ${edBadge(t.ed)}</div>`).join('')}</td><td class="n qty">${q(i.qty)}</td><td class="n qty">${q(o.packed[i.sku]||0)}</td></tr>`}).join('')}
   </tbody></table></div>
   <p class="muted small">Ambil yang ED-nya paling dekat lebih dulu. Barang kedaluwarsa tidak ikut dialokasikan.</p>
   <div class="grid2"><label class="field"><span>No. resi / keterangan kirim</span><input id="pk-resi" placeholder="mis. JX1234567890 atau diambil kurir toko"></label></div>
   <label class="chk"><input type="checkbox" id="pk-manual"> Konfirmasi manual tanpa scan (dicatat di riwayat)</label>
   <div class="row"><button class="btn primary" data-act="pack-done">Selesai kemas & kirim</button><button class="btn ghost" data-act="pack-reset">Ulang scan</button></div></section>`; }

/* ================= CEK MINGGUAN ================= */
V.cek=()=>{ const s=S.week.session, wk=isoWeek(TODAY);
  const head=`<div class="row between"><h2>Cek mingguan · minggu ${wk}</h2>${s?(s.status==='done'?'<span class="badge b-ok">Selesai</span>':s.status==='submitted'?'<span class="badge b-warn">Menunggu owner</span>':'<span class="badge b-info">Sedang dihitung</span>'):'<span class="badge b-neu">Belum mulai</span>'}</div>
  <p class="muted">Seminggu sekali, hitung fisik semua barang lalu bandingkan dengan sistem, supaya selisih tidak menumpuk.</p>`;
  if(!s) return head+`<section class="panel"><p>Saat menghitung, angka sistem tidak ditampilkan supaya hitungan jujur.</p><div class="row"><button class="btn primary" data-act="cek-start">Mulai cek minggu ini</button></div></section>`+histPanel();
  if(s.status==='counting') return head+`<section class="panel"><div class="row between"><h3>Isi jumlah fisik</h3><button class="btn scanbtn" data-act="cek-scan">Scan beruntun (+1 per scan)</button></div>
   <div class="tbl-wrap"><table><thead><tr><th>Produk</th><th class="n">Jumlah fisik</th></tr></thead><tbody>${s.lines.map((l,i)=>`<tr><td>${esc(prodName(l.sku))}<div class="muted small code">${l.sku}</div></td><td class="n"><input type="number" min="0" id="cek-${i}" value="${l.fisik??''}" style="width:100px" aria-label="Jumlah fisik ${esc(prodName(l.sku))}" placeholder="hitung"></td></tr>`).join('')}</tbody></table></div>
   <div class="row"><button class="btn" data-act="cek-fill">Isi contoh (demo)</button><button class="btn primary" data-act="cek-submit">Kirim hasil hitung</button></div></section>`;
  const diffs=s.lines.filter(l=>l.fisik!==l.sistem);
  return head+`<section class="panel"><h3>${diffs.length?`${diffs.length} produk selisih`:'Semua cocok'}</h3>
   ${diffs.length?`<div class="tbl-wrap"><table><thead><tr><th>Produk</th><th class="n">Sistem</th><th class="n">Fisik</th><th class="n">Selisih</th>${seeCost()?'<th class="n">Nilai</th>':''}<th>Alasan</th></tr></thead><tbody>${diffs.map(l=>{const i=s.lines.indexOf(l),d=l.fisik-l.sistem;return `<tr><td>${esc(prodName(l.sku))}</td><td class="n">${q(l.sistem)}</td><td class="n">${q(l.fisik)}</td><td class="n qty" style="color:${d<0?'var(--bad)':'var(--ok)'}">${d>0?'+':''}${q(d)}</td>${seeCost()?`<td class="n">${rp(d*(prod(l.sku)?.cost||0))}</td>`:''}<td>${s.status==='done'?esc(l.reason):`<select id="cek-r-${i}" aria-label="Alasan"><option value="">— pilih —</option>${['Salah hitung / salah kirim','Rusak / pecah','Hilang','Lupa dicatat keluar','Lupa dicatat masuk'].map(r=>`<option ${l.reason===r?'selected':''}>${r}</option>`).join('')}</select>`}</td></tr>`}).join('')}</tbody></table></div>`:''}
   ${s.status==='submitted'?(canApprove()?`<div class="row"><button class="btn primary" data-act="cek-approve">Setujui & sesuaikan stok</button><button class="btn" data-act="cek-reopen">Minta hitung ulang</button></div>`:`<div class="row"><button class="btn" data-act="cek-reason">Simpan alasan</button></div><div class="note">Menunggu persetujuan owner.</div>`):''}</section>`+histPanel(); };
function histPanel(){ if(!seeCost()) return ''; return `<section class="panel"><h3>Riwayat cek mingguan</h3><div class="tbl-wrap"><table><thead><tr><th>Minggu</th><th class="n">Produk selisih</th><th class="n">Nilai selisih</th></tr></thead><tbody>${S.week.history.map(h=>`<tr><td>Minggu ${h.w}</td><td class="n">${h.n}</td><td class="n" style="color:${h.val<0?'var(--bad)':'inherit'}">${rp(h.val)}</td></tr>`).join('')}</tbody></table></div></section>`; }

 penjualan:['Penjualan (semua kanal)',()=>S.orders.filter(o=>o.status==='dikirim').flatMap(o=>o.lines.map(l=>({tanggal:o.sent||o.date,kanal:CHANNEL[o.channel],dokumen:o.no,referensi:o.ref,pembeli:o.channel==='b2b'?custName(o.customer):o.customer,sku:l.ext,produk:l.name,qty:l.qty,harga:l.price,nilai:l.qty*l.price})))],
 stok:['Stok per ED & nilai',()=>S.lots.filter(l=>l.qty>0).map(l=>({brand:BRANDS[prod(l.sku)?.brand]||'',sku:l.sku,produk:prodName(l.sku),ed:l.ed||'',qty:l.qty,hpp:prod(l.sku)?.cost||0,nilai:l.qty*(prod(l.sku)?.cost||0)}))],
 pembelian:['Barang masuk per supplier',()=>S.inbounds.flatMap(i=>i.lines.map(l=>({tanggal:i.date,dokumen:i.no,supplier:supName(i.supplier),surat_jalan:i.sj||'(tanpa)',sku:l.sku,produk:prodName(l.sku),ed:l.ed||'',qty:l.qty,hpp:prod(l.sku)?.cost||0,nilai:l.qty*(prod(l.sku)?.cost||0),verifikasi:i.verified||'belum'})))],

 riwayat:['Riwayat stok (kartu stok)',()=>S.moves.map(m=>({waktu:m.t.slice(0,16).replace('T',' '),jenis:m.type,dokumen:m.ref,sku:m.sku,ed:m.ed||'',qty:m.qty,keterangan:m.note,oleh:m.by}))],
};

  <div id="print-area"><div class="labels">${list.filter(Boolean).map((p,i)=>`<div class="label"><div class="qr" data-qr="${esc(p.sku)}" id="qr-${i}"></div><div><b>${esc(p.sku)}</b><small>${esc(p.name)}</small><small>${BRANDS[p.brand]}</small></div></div>`).join('')}</div></div></section>`; }

A['sc-close']=closeScanner; A['sc-bg']=(d,e)=>{ if(e.target.classList.contains('sheet-bg')) closeScanner(); };

A.mpch=d=>{S.ui.mpch=d.c;S.ui.lastImport='';render()}; A.ptab=d=>{S.ui.ptab=d.c;render()};
A['mp-import']=()=>{ const ch=S.ui.mpch||'shopee', f=MP_FILES[ch]; const groups={};
  f.rows.forEach(r=>{(groups[r[0]]=groups[r[0]]||{ref:r[0],status:r[1],buyer:r[2],lines:[]}).lines.push({ext:r[3],name:r[4],qty:r[5],price:ch==='tiktok'?r[6]/r[5]:r[6]})});
  let nw=0,dup=0,bt=0; Object.values(groups).forEach(g=>{ const key=ch+':'+g.ref; if(S.imported[key]){dup++;return} S.imported[key]=1;
    const cancel=/batal|cancel/i.test(g.status); if(cancel) bt++;
    const o={no:docno('OUT'),channel:ch,ref:g.ref,customer:g.buyer,date:iso(TODAY),status:cancel?'batal':'baru',tax:0,lines:g.lines,items:[],packed:{},by:who()};
    rebuildItems(o); S.orders.push(o); nw++; });
  const unm=S.orders.filter(o=>o.status==='perlu_peta').length;
  S.ui.lastImport=nw?`${f.rows.length} baris → ${nw} pesanan baru (${bt} batal)${unm?`, ${unm} pesanan menunggu SKU dipetakan`:''}. Pesanan lain langsung muncul di layar gudang.`:`Semua ${dup} pesanan sudah pernah diimpor. Tidak ada yang dobel.`;
  banner(nw?'ok':'info',nw?'IMPOR BERHASIL':'TIDAK ADA YANG DOBEL',S.ui.lastImport); render(); };
A['map-save']=d=>{ const sku=document.getElementById('map-'+d.s).value, k=Math.max(1,+document.getElementById('mk-'+d.s).value||1); S.mapping[d.s]=[[sku,k]];
  S.orders.filter(o=>o.status==='perlu_peta').forEach(rebuildItems); banner('ok','SKU DIPETAKAN',`${d.s} = ${k} × ${prodName(sku)}`); render(); };
A['o-cancel']=d=>{ const o=S.orders.find(x=>x.no===d.no); if(o&&o.status==='baru'){ o.status='batal'; banner('info','PESANAN DIBATALKAN',o.no); render(); } };
A['new-so']=()=>{ S.view='pesanan'; S.ui.soForm=true; S.ui.so={channel:'b2b',cust:'CV-TIRTA',ref:'',lines:[]}; render(); };
A['so-close']=()=>{S.ui.soForm=false;render()};
A['so-add']=()=>{ const p=readSku('so-sku'); const qty=+$('#so-qty').value; const price=$('#so-price').value===''?p?.price:+$('#so-price').value; soSync();
  if(!p) return banner('bad','PRODUK BELUM DIPILIH','Scan atau ketik SKU / nama produk');
  if(!(qty>0)) return banner('bad','QTY TIDAK VALID','');
  const ex=S.ui.so.lines.find(l=>l.ext===p.sku); if(ex) ex.qty+=qty; else S.ui.so.lines.push({ext:p.sku,name:p.name,qty,price});
  S.ui['so-sku']=''; render(); };
A['so-del']=d=>{ soSync(); S.ui.so.lines.splice(+d.i,1); render(); };
function soSync(){ const d=S.ui.so; d.channel=$('#so-ch').value; if($('#so-cust')) d.cust=$('#so-cust').value; if($('#so-buyer')) d.buyer=$('#so-buyer').value; d.ref=$('#so-ref').value; }
A['so-save']=()=>{ soSync(); const d=S.ui.so; const short=d.lines.filter(l=>available(l.ext)<l.qty);
  if(short.length) return banner('bad','STOK TIDAK CUKUP',short.map(l=>`${l.ext} tersedia ${available(l.ext)}`).join('; '));
  const o={no:docno(d.channel==='b2b'?'SO':'OUT'),channel:d.channel,ref:d.ref||'-',customer:d.channel==='b2b'?d.cust:(d.buyer||'Pembeli langsung'),date:iso(TODAY),status:'baru',tax:d.channel==='b2b'?11:0,lines:d.lines,items:[],packed:{},by:who()};
  rebuildItems(o);
  if(o.channel==='b2b'){ const c=S.customers.find(x=>x.code===o.customer); const out=S.invoices.filter(i=>i.cust===c.code).reduce((a,i)=>a+i.total-i.paid,0)+S.orders.filter(x=>x.channel==='b2b'&&x.customer===c.code&&!x.invoice&&x.status!=='batal').reduce((a,x)=>a+orderTotal(x),0);
    if(out+orderTotal(o)>c.limit){ S.seq.SO--; return banner('bad','MELEBIHI LIMIT KREDIT',`${c.name}: piutang & order berjalan ${rp(out)} + order ini ${rp(orderTotal(o))} > limit ${rp(c.limit)}`); } }
  S.orders.push(o); S.ui.soForm=false; banner('ok','PESANAN DIKIRIM KE GUDANG',`${o.no} muncul di layar Kemas & kirim`); render(); };
/* kemas */
A['pack-open']=d=>{ S.ui.packNo=d.no; render(); };
A['pack-scan']=()=>{ const no=S.ui.packNo; openScanner('Scan barang untuk '+no,p=>{ const o=S.orders.find(x=>x.no===no); const it=o.items.find(i=>i.sku===p.sku);
  if(!it) return banner('bad','SALAH BARANG',`${p.name} tidak ada di pesanan ini`);
  if((o.packed[p.sku]||0)>=it.qty) return banner('bad','KELEBIHAN',`${p.name} sudah lengkap. Kembalikan ke rak`);
  o.packed[p.sku]=(o.packed[p.sku]||0)+1; const pl=planOut(p.sku,it.qty,false); const rest=o.items.reduce((a,i)=>a+i.qty-(o.packed[i.sku]||0),0);
  banner('ok','BENAR · '+p.name,`Ambil ${pl.take[0]?.ed?'ED '+fdate(pl.take[0].ed):'mana saja'} · sisa ${rest} barang`); save(); renderView(); },true); };
A['pack-reset']=()=>{ const o=S.orders.find(x=>x.no===S.ui.packNo); o.packed={}; render(); };
A['pack-done']=()=>{ const o=S.orders.find(x=>x.no===S.ui.packNo); const manual=$('#pk-manual').checked; const left=o.items.filter(i=>(o.packed[i.sku]||0)<i.qty);
  if(left.length&&!manual) return banner('bad','BELUM SEMUA DI-SCAN',left.map(i=>`${i.sku} kurang ${i.qty-(o.packed[i.sku]||0)}`).join('; ')+'. Centang konfirmasi manual bila tanpa scan.');
  const plans=o.items.map(i=>({i,pl:planOut(i.sku,i.qty,false)})); const short=plans.filter(x=>x.pl.short>0);
  if(short.length) return banner('bad','STOK TIDAK CUKUP',short.map(x=>`${x.i.sku} kurang ${x.pl.short}`).join('; '));
  const resi=$('#pk-resi').value.trim();
  plans.forEach(({i,pl})=>pl.take.forEach(t=>addStock(i.sku,t.ed,-t.qty,'keluar',o.no,`${CHANNEL[o.channel]} · ${o.ref}${manual&&left.length?' · konfirmasi manual':''}`)));
  o.status='dikirim'; o.sent=iso(TODAY); o.resi=resi; o.packedBy=who(); S.ui.packNo=null;
  banner('ok','PESANAN DIKIRIM',`${o.no} · stok berkurang${o.channel==='b2b'?' · finance bisa buat faktur':''}`); render(); };
/* barang masuk */
function inSync(){ const d=S.inDraft; if(!d||!$('#in-sup')) return; d.supplier=$('#in-sup').value==='__new'?d.supplier:$('#in-sup').value; d.sj=$('#in-sj').value; d.sjDate=$('#in-sjdate').value; if($('#in-nosj-note')) d.noSjNote=$('#in-nosj-note').value; }
A['sup-add']=()=>{ const n=$('#sup-name').value.trim(); if(!n) return banner('bad','NAMA SUPPLIER KOSONG',''); const id='S'+(S.suppliers.length+1); S.suppliers.push({id,name:n,note:''}); inSync(); S.inDraft.supplier=id; S.ui.newSup=false; banner('ok','SUPPLIER DITAMBAHKAN',n); render(); };
A['in-add']=()=>{ inSync(); const p=readSku('in-sku'); const qty=+$('#in-qty').value; S.ui['in-qty']=qty;
  if(!p) return banner('bad','PRODUK BELUM DIPILIH','Scan label atau ketik SKU / nama');
  if(!(qty>0)) return banner('bad','JUMLAH BELUM DIISI','');
  let ed=null,batch='';
  if(p.ed){ const el=$('#in-ed'); if(!el){ S.ui['in-sku']=p.sku+' — '+p.name; render(); return banner('info','ISI TANGGAL ED','Produk ini wajib dicatat ED-nya'); }
    ed=el.value; batch=($('#in-batch')?.value||'').trim().toUpperCase();
    if(!ed) return banner('bad','TANGGAL ED WAJIB','Lihat tanggal kedaluwarsa di kemasan');
    if(days(ed)<0) return banner('bad','ED SUDAH LEWAT',`${fdate(ed)} sudah lewat. Periksa kemasannya`); }
  const same=S.inDraft.lines.find(l=>l.sku===p.sku&&l.ed===ed); if(same) same.qty+=qty; else S.inDraft.lines.push({sku:p.sku,ed,qty,batch});
  S.ui['in-sku']=''; S.ui['in-ed']='';
  banner(ed&&edState(ed)==='warn'?'info':'ok',ed&&edState(ed)==='warn'?'DITAMBAHKAN · ED DEKAT':'DITAMBAHKAN',`${p.name} · ${qty} pcs${ed?' · ED '+fdate(ed):''}`); render(); };
A['in-del']=d=>{ inSync(); S.inDraft.lines.splice(+d.i,1); render(); };
A['in-photo-del']=()=>{ inSync(); S.inDraft.photo=null; render(); };
A['in-save']=()=>{ inSync(); const d=S.inDraft;
  if(!d.supplier) return banner('bad','PILIH SUPPLIER','Pilih dari daftar atau tambah supplier baru');
  if(!d.noSj&&!d.sj.trim()) return banner('bad','NO. SURAT JALAN WAJIB','Isi sesuai surat jalan, atau centang "Tidak ada surat jalan"');
  if(d.noSj&&!(d.noSjNote||'').trim()) return banner('bad','KETERANGAN WAJIB','Jelaskan kenapa tidak ada surat jalan');
  const no=docno('IN');
  d.lines.forEach(l=>addStock(l.sku,l.ed,l.qty,'masuk',no,`${supName(d.supplier)} · SJ ${d.noSj?'-':d.sj}${l.batch?' · batch '+l.batch:''}`));
  S.inbounds.push({no,date:iso(TODAY),supplier:d.supplier,sj:d.noSj?'':d.sj.trim(),sjDate:d.sjDate,noSjNote:d.noSj?d.noSjNote:'',photo:d.photo,receiver:who(),lines:d.lines,verified:null});
  S.inDraft=newInDraft(); banner('ok','BARANG MASUK DISIMPAN',`${no} · ${d.lines.length} baris · menunggu verifikasi finance`); render(); };
A['in-verify']=d=>{ const i=S.inbounds.find(x=>x.no===d.no); i.verified=who()+' · '+fdate(iso(TODAY)); banner('ok','BARANG MASUK TERVERIFIKASI',i.no); render(); };
/* keluar manual */
A['mo-submit']=()=>{ const p=readSku('mo-sku'), purpose=$('#mo-purpose').value, qty=+$('#mo-qty').value, note=$('#mo-note').value.trim();
  S.ui.moPurpose=purpose; S.ui['mo-qty']=qty; S.ui['mo-note']=note;
  if(!p) return banner('bad','PRODUK BELUM DIPILIH','Scan atau ketik SKU'); if(!(qty>0)) return banner('bad','JUMLAH TIDAK VALID','');
  if(!note) return banner('bad','KETERANGAN WAJIB','Tulis alasan barang dikeluarkan');
  const pl=planOut(p.sku,qty,purpose==='rusak');
  if(pl.short>0){ const ex=lotsOf(p.sku).filter(l=>edState(l.ed)==='expired').reduce((a,l)=>a+l.qty,0); return banner('bad','STOK TIDAK CUKUP',`kurang ${pl.short}${ex&&purpose!=='rusak'?` (${ex} kedaluwarsa hanya boleh keluar untuk dibuang)`:''}`); }
  const m={no:docno('KM'),purpose,sku:p.sku,qty,note,by:who(),status:'pending'};
  if(S.role==='staf'){ S.manualOut.push(m); S.ui['mo-sku']=''; banner('info','DIAJUKAN KE OWNER',`${m.no} · stok belum berkurang`); render(); return; }
  moPost(m,'Langsung oleh '+who()); S.manualOut.push(m); S.ui['mo-sku']=''; banner('ok','BARANG KELUAR',`${m.no} · ${takeText(m.take)}`); render(); };
function moPost(m,approver){ const pl=planOut(m.sku,m.qty,m.purpose==='rusak'); if(pl.short>0) throw new Error(`Stok ${m.sku} kurang ${pl.short}`);
  pl.take.forEach(t=>addStock(m.sku,t.ed,-t.qty,'keluar manual',m.no,`${MO_PURPOSE[m.purpose]}: ${m.note}`,m.by)); m.take=pl.take; m.status='posted'; m.approver=approver; }
A['mo-approve']=d=>{ const m=S.manualOut.find(x=>x.no===d.no); moPost(m,'Disetujui '+who()); banner('ok','DISETUJUI',`${m.no} · stok berkurang`); render(); };
A['mo-reject']=d=>{ const m=S.manualOut.find(x=>x.no===d.no); m.status='ditolak'; m.approver='Ditolak '+who(); banner('info','DITOLAK',m.no); render(); };
/* cek mingguan */
A['cek-start']=()=>{ S.week.session={no:docno('CEK'),status:'counting',lines:S.products.filter(p=>stockOf(p.sku)>0).map(p=>({sku:p.sku,fisik:null}))}; render(); };
function cekSync(){ const s=S.week.session; s.lines.forEach((l,i)=>{ const el=$('#cek-'+i); if(el) l.fisik=el.value===''?null:Math.max(0,+el.value); }); }
A['cek-scan']=()=>{ cekSync(); openScanner('Hitung dengan scan',p=>{ const s=S.week.session; const l=s.lines.find(x=>x.sku===p.sku); if(!l) return banner('bad','TIDAK ADA DI DAFTAR',`${p.name} tidak tercatat punya stok`);
  l.fisik=(l.fisik||0)+1; banner('ok','+1 · '+p.name,`dihitung ${l.fisik}`); save(); renderView(); },true); };
A['cek-fill']=()=>{ S.week.session.lines.forEach((l,i)=>{ const off={'ZDO-RO-MXF-40':-3,'ZDO-SPR-ZEN-60':-1,'WT-NACL-1KG':2}[l.sku]||0; $('#cek-'+i).value=stockOf(l.sku)+off; }); banner('info','CONTOH TERISI','3 produk sengaja dibuat selisih'); };
A['cek-submit']=()=>{ cekSync(); const s=S.week.session; const empty=s.lines.filter(l=>l.fisik===null).length;
  if(empty) return banner('bad','BELUM SEMUA DIHITUNG',`${empty} produk belum diisi`);
  s.lines.forEach(l=>l.sistem=stockOf(l.sku)); s.status='submitted'; s.by=who(); const n=s.lines.filter(l=>l.fisik!==l.sistem).length;
  banner(n?'info':'ok',n?`${n} PRODUK SELISIH`:'SEMUA COCOK',n?'Isi alasan, lalu owner menyetujui':'Owner tinggal menyetujui'); render(); };
function cekReasons(){ S.week.session.lines.forEach((l,i)=>{const r=$('#cek-r-'+i); if(r) l.reason=r.value}); }
A['cek-reason']=()=>{ cekReasons(); banner('ok','ALASAN DISIMPAN','Menunggu owner'); save(); };
A['cek-reopen']=()=>{ S.week.session.status='counting'; render(); };
A['cek-approve']=()=>{ cekReasons(); const s=S.week.session; const diffs=s.lines.filter(l=>l.fisik!==l.sistem);
  if(diffs.some(l=>!l.reason)) return banner('bad','ALASAN BELUM LENGKAP','Setiap selisih perlu alasan');
  let val=0; diffs.forEach(l=>{ let d=l.fisik-l.sistem; val+=d*(prod(l.sku)?.cost||0);
    if(d<0){ for(const lot of lotsOf(l.sku)){ if(d>=0) break; const n=Math.min(lot.qty,-d); addStock(l.sku,lot.ed,-n,'cek mingguan',s.no,l.reason); d+=n; } }
    else { const ls=lotsOf(l.sku); addStock(l.sku,ls.length?ls[ls.length-1].ed:null,d,'cek mingguan',s.no,l.reason); } });
  s.status='done'; S.week.history.push({w:isoWeek(TODAY),n:diffs.length,val}); banner('ok','CEK MINGGUAN SELESAI','Stok sistem = fisik'); render(); };
/* faktur */
A['inv-make']=d=>{ const o=S.orders.find(x=>x.no===d.no); const c=S.customers.find(x=>x.code===o.customer); const no=docno('INV');
  S.invoices.push({no,cust:c.code,so:o.no,date:iso(TODAY),due:dayOff(c.terms),total:orderTotal(o),paid:0}); o.invoice=no; banner('ok','FAKTUR DIBUAT',`${no} · jatuh tempo ${c.terms} hari`); render(); };
A['inv-pay']=d=>{ const i=S.invoices.find(x=>x.no===d.no); i.paid=i.total; banner('ok','PEMBAYARAN DICATAT',`${i.no} lunas`); render(); };
/* laporan */
A.exp=d=>{S.ui.exp=d.c;render()};
A.csv=()=>{ const [,fn]=DATASETS[S.ui.exp||'penjualan']; const rows=fn(); if(!rows.length) return banner('bad','TIDAK ADA DATA','');
  const cols=Object.keys(rows[0]); const csv=[cols.join(','),...rows.map(r=>cols.map(c=>typeof r[c]==='number'?r[c]:'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))].join('\n');
  const ok=()=>banner('ok','CSV DISALIN',`${rows.length} baris. Tempel di Excel / Google Sheets`);
  try{ navigator.clipboard.writeText(csv).then(ok,()=>banner('bad','GAGAL MENYALIN','Browser menolak akses clipboard')); }catch(e){ banner('bad','GAGAL MENYALIN',''); } };
/* produk & label */
A['np-save']=()=>{ const sku=$('#np-sku').value.trim().toUpperCase(), name=$('#np-name').value.trim();
  if(!/^[A-Z0-9._-]{3,30}$/.test(sku)) return banner('bad','KODE SKU TIDAK VALID','3–30 huruf besar/angka/titik/minus, tanpa spasi');
  if(prod(sku)) return banner('bad','SKU SUDAH ADA',sku); if(!name) return banner('bad','NAMA WAJIB','');
  const bc=$('#np-bc').value.trim(); if(bc&&S.products.some(p=>p.bc===bc)) return banner('bad','BARCODE SUDAH DIPAKAI',bc);
  S.products.push({sku,bc,name,brand:$('#np-brand').value,ed:$('#np-ed').checked,min:+$('#np-min').value||0,cost:+$('#np-cost').value||0,price:+$('#np-price').value||0});
  fillSkuList(); banner('ok','PRODUK DISIMPAN',`${sku} · cetak labelnya di bawah`); render(); };
A['lbl-make']=()=>{ labelSync(); const n=Object.values(S.ui.labelSel).reduce((a,b)=>a+(+b||0),0); if(!n) return banner('bad','ISI JUMLAH LABEL','Isi kolom Label di produk yang mau dicetak'); S.ui.labels=true; render(); };
function labelSync(){ S.ui.labelSel={}; document.querySelectorAll('[data-label]').forEach(i=>{ if(+i.value>0) S.ui.labelSel[i.dataset.label]=Math.min(200,+i.value); }); }
A['lbl-print']=()=>{ try{ window.print(); }catch(e){} };

/* ================= RENDER & EVENT ================= */
function fillSkuList(){ $('#skulist').innerHTML=S.products.map(p=>`<option value="${esc(p.sku)} — ${esc(p.name)}"></option>`).join(''); }
function renderView(){ $('#view').innerHTML=V[S.view](); drawQRs(); }
function render(){ if(!allowed(S.view)) S.view='home'; renderMenu(); renderView(); $('#role').value=S.role; save(); }
document.addEventListener('click',e=>{ const el=e.target.closest('[data-act]'); if(!el) return; const a=A[el.dataset.act]; if(!a) return; e.preventDefault();
  try{ a(el.dataset,e); }catch(err){ banner('bad','GAGAL',err.message); } });
document.addEventListener('submit',e=>{ if(e.target.id==='sc-form'){ e.preventDefault(); const v=$('#sc-in').value; const m=v.match(/^([A-Za-z0-9._-]+)\s+—/); handleCode(m?m[1]:v); const i=$('#sc-in'); if(i) i.value=''; } });
document.addEventListener('change',async e=>{ const id=e.target.id;
  if(id==='warn'){S.warn=+e.target.value;render()}
  if(id==='stok-brand'){S.ui.brand=e.target.value;render()}
  if(id==='so-ch'){ soSync(); render(); }
  if(id==='in-sup'){ if(e.target.value==='__new'){ inSync(); S.ui.newSup=true; render(); } else { S.ui.newSup=false; inSync(); } }
  if(id==='in-nosj'){ inSync(); S.inDraft.noSj=e.target.checked; render(); }
  if(id==='mo-purpose'){ S.ui.moPurpose=e.target.value; }
  if(id==='in-sku'||id==='mo-sku'){ keepForms(); S.ui[id]=e.target.value; render(); }
  if(id==='sc-photo'&&e.target.files[0]) decodePhoto(e.target.files[0]);
  if(id==='in-photo'&&e.target.files[0]){ try{ inSync(); const c=await shrink(e.target.files[0],900); S.inDraft.photo=c.toDataURL('image/jpeg',.6); render(); banner('ok','FOTO BUKTI TERSIMPAN',''); }catch(err){ banner('bad','FOTO GAGAL DIBACA',err.message); } }
  if(e.target.dataset&&e.target.dataset.label){ labelSync(); }
});
document.addEventListener('input',e=>{ if(e.target.id==='stok-q'){ S.ui.q=e.target.value; const pos=e.target.selectionStart; renderView(); const i=$('#stok-q'); i.focus(); i.setSelectionRange(pos,pos); } });
$('#role').addEventListener('change',e=>{ S.role=e.target.value; S.view='home'; S.ui.packNo=null; render(); banner('info','Masuk sebagai '+e.target.selectedOptions[0].text, seeCost()?'Semua angka termasuk HPP terlihat':'HPP & nilai stok disembunyikan'); });
if(!load()) seed();
S.ui=S.ui||{}; fillSkuList(); render();
window.addEventListener('load',drawQRs);
</script>
